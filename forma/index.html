<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>FORMA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#efe9df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FORMA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>window.FORMA_CONFIG = window.FORMA_CONFIG || {};</script>
<script src="config.js" onerror="void 0"></script>
<style>
/* Layout: one phone-width column, sticky header, bottom tab bar; cards only for things you act on */
:root{
  --bg:#efe9df; --bg2:rgba(20,20,20,.06); --card:rgba(255,255,255,.55); --ink:#141414; --ink2:#5d574e; --ink3:#9a9184;
  --line:rgba(20,20,20,.08); --accent:#141414; --accent2:#8c8478; --accentSoft:rgba(20,20,20,.07);
  --green:#1f7a4d; --greenSoft:rgba(31,122,77,.1); --red:#b23a3a; --redSoft:rgba(178,58,58,.1); --blue:#8c8478; --blueSoft:rgba(140,132,120,.15);
  --amber:#c2a878; --amberSoft:rgba(194,168,120,.18);
  --glass:rgba(255,255,255,.5); --glassLine:rgba(255,255,255,.8);
  --shadow:0 10px 30px rgba(70,52,28,.08),inset 0 1px 0 rgba(255,255,255,.7);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Sora","IBM Plex Sans",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:22px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body{background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.06em}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff}
.avatar{width:34px;height:34px;border-radius:99px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:800;border:none}
h1{font-size:27px;letter-spacing:-.03em;margin:6px 0 2px;font-weight:800;text-wrap:balance}
h2{font-size:16px;margin:24px 2px 10px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--ink2);font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.btn{border:none;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--bg2);color:var(--ink)}
.btn.small{padding:8px 12px;border-radius:11px;font-size:13.5px}
.btn.danger{background:var(--redSoft);color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:none;color:var(--accent);font-weight:700;padding:0;font-size:13.5px}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:15px;color:var(--ink)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.pill.green{background:var(--greenSoft);color:var(--green)}.pill.orange{background:var(--accentSoft);color:var(--accent)}
.pill.blue{background:var(--blueSoft);color:var(--blue)}.pill.amber{background:var(--amberSoft);color:var(--amber)}
.demo{display:flex;gap:10px;align-items:center;background:var(--amberSoft);color:var(--amber);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:4px}
/* today ring */
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media(max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.macro{display:grid;gap:4px}
.macro .lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink2)}
.bar{height:7px;border-radius:9px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile .n{font-size:22px;font-weight:800;letter-spacing:-.02em}
.tile .l{font-size:12px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 8px;display:grid;justify-items:center;gap:6px;font-weight:700;font-size:12.5px;box-shadow:var(--shadow)}
.quick svg{color:var(--accent)}
.coach{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.coach .sub{color:#fff;opacity:.9}
.coach .btn{background:rgba(255,255,255,.22)}
/* lists */
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li img,.li .ph{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg2);display:grid;place-items:center;color:var(--ink3)}
.li .t{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.li .d{font-size:12.5px;color:var(--ink2)}
.kcal{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-size:10px;font-family:var(--mono)}
.empty{color:var(--ink2);font-size:13.5px;text-align:center;padding:18px 8px}
.list-plain{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.steps{counter-reset:s;display:grid;gap:10px;margin:8px 0 0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:99px;background:var(--accentSoft);color:var(--accent);font-weight:800;font-size:12px;display:grid;place-items:center}
code,.code{font-family:var(--mono);font-size:12.5px;background:var(--bg2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:none;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--ink3)}
nav.tabs button.on{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.photo-prev{width:100%;max-height:260px;object-fit:cover;border-radius:16px;display:block}
.item-edit{display:grid;grid-template-columns:1fr 64px 56px 56px 56px 28px;gap:6px;align-items:center}
.item-edit input{padding:8px 6px;font-size:13.5px;text-align:center;min-width:0}
.item-edit input:first-child{text-align:left}
.item-edit .h{font-size:10.5px;font-weight:700;color:var(--ink3);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.item-edit .h:first-child{text-align:left}
.x{border:none;background:none;color:var(--ink3);font-size:18px;padding:0}
.spinner{width:22px;height:22px;border:3px solid var(--accentSoft);border-top-color:var(--accent);border-radius:99px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.bf{font-size:34px;font-weight:800;letter-spacing:-.03em}
.auth{max-width:420px;margin:8vh auto 0;display:grid;gap:14px}
/* v2: plans, barcode, streaks, reminders */
.quick{grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{padding:12px 4px;font-size:11.5px;line-height:1.2;text-align:center}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--accent);background:var(--accentSoft);border-radius:99px;padding:6px 11px 6px 8px;border:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week .d{display:grid;justify-items:center;gap:2px;padding:7px 0;border-radius:12px;background:var(--bg2);font-size:11.5px;font-weight:800;color:var(--ink3);min-height:46px}
.week .d.train{background:var(--accentSoft);color:var(--accent)}
.week .d.done{background:var(--accent);color:#fff}
.week .d.today{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.ex{border-bottom:1px solid var(--line);padding:12px 0}
.ex:last-child{border-bottom:none}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.set{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:13px;color:var(--ink2)}
.set.on{background:var(--green);border-color:var(--green);color:#fff}
input.in.kg{width:78px;padding:9px 6px;text-align:center;margin-left:auto}
.restbar{position:sticky;top:-18px;z-index:2;margin:-18px -16px 12px;padding:11px 16px;background:var(--green);color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-radius:22px 22px 0 0}
.restbar button{background:rgba(255,255,255,.22);border:none;color:#fff;font-weight:700;border-radius:10px;padding:6px 12px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;display:grid;justify-items:center;align-content:start;gap:5px}
.badge .medal{width:44px;height:44px;border-radius:99px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.badge.locked .medal{background:var(--bg2);color:var(--ink3)}
.badge.locked .bt{color:var(--ink2)}
.badge .bt{font-weight:800;font-size:12.5px;line-height:1.2}
.badge .bd{font-size:11px;color:var(--ink2);line-height:1.25}
.scanbox{width:100%;min-height:240px;border-radius:16px;overflow:hidden;background:#111;position:relative}
.scanbox video{width:100%!important;display:block;border-radius:16px}
input[type=time].in{width:124px;flex:none;padding:8px 6px;font-size:14px}
.rem{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.rem input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
/* v4: cream + black, frosted glass */
h1,h2,h3,.bf,.big,.n,.kbig,.sn,.brand,.kcal,.tile .n,.ct{font-family:var(--disp)}
h1{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:10px 0 4px}
h2{font-size:17px;font-weight:600;margin:28px 2px 12px;letter-spacing:-.01em}
body{background:var(--bg);min-height:100vh}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 30% at 85% 8%,rgba(214,196,168,.55),transparent 70%),
             radial-gradient(45% 35% at 5% 45%,rgba(255,255,255,.9),transparent 70%),
             radial-gradient(40% 30% at 90% 85%,rgba(196,182,160,.45),transparent 70%)}
.eyebrow{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;color:var(--ink2)}
.card,.tile,.quick button,.badge,.coach{background:var(--glass);border:1px solid var(--glassLine);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
.card{padding:18px;border-radius:22px}
.tile{border-radius:18px}
.tile .l{font-weight:500}
.btn{background:var(--ink);color:var(--bg);border-radius:14px;font-weight:600}
.btn.ghost{background:rgba(255,255,255,.55);color:var(--ink);border:1px solid var(--glassLine)}
.btn.danger{background:rgba(180,40,40,.08);color:#a12a2a}
.mark{background:var(--ink);color:var(--bg);border-radius:9px}
.brand{letter-spacing:.14em;font-weight:600}
.avatar{background:rgba(255,255,255,.6);color:var(--ink);border:1px solid var(--glassLine)}
header.top{background:rgba(239,233,223,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
body::before{background:rgba(239,233,223,.9)}
nav.tabs{background:rgba(250,247,241,.72);border-top:1px solid var(--glassLine);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
nav.tabs button{font-weight:600;color:var(--ink3)}
nav.tabs button.on{color:var(--ink)}
.quick button{font-weight:600;color:var(--ink)}
.quick svg{color:var(--ink)}
.coach{color:var(--ink)}
.coach .sub{color:var(--ink2);opacity:1}
.coach .btn{background:var(--ink);color:var(--bg)}
.demo{background:rgba(255,255,255,.55);color:var(--ink2);border:1px solid var(--glassLine)}
.streak{background:var(--ink);color:var(--bg)}
.pill{background:rgba(255,255,255,.6);color:var(--ink2)}
.pill.green{background:rgba(31,122,77,.1);color:#1f7a4d}.pill.amber{background:rgba(150,110,30,.1);color:#8a6418}
.pill.orange,.pill.blue{background:rgba(17,17,17,.07);color:var(--ink)}
.seg{background:rgba(17,17,17,.06)}
.seg button.on{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
input.in,select.in,textarea.in{background:rgba(255,255,255,.6);border-color:var(--glassLine)}
.sheet{background:rgba(250,247,241,.88);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border-top:1px solid var(--glassLine)}
.scrim{background:rgba(20,18,14,.35)}
.toast{background:var(--ink);color:var(--bg)}
.badge .medal{background:var(--ink);color:var(--bg)}
.badge.locked .medal{background:rgba(17,17,17,.06);color:var(--ink3)}
.set.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.restbar{background:var(--ink);color:var(--bg)}
.steps li::before{background:var(--ink);color:var(--bg)}
code,.code{background:rgba(17,17,17,.06)}
.li img,.li .ph{background:rgba(17,17,17,.05)}
.ring .big{font-size:34px}
.hero{gap:20px}
/* training days */
.train-card .ct{font-size:16px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.55);border:1px solid var(--glassLine);border-radius:16px;padding:12px}
.sn{font-size:28px;font-weight:600;color:var(--ink);line-height:1;letter-spacing:-.02em}
.sn span{font-size:14px;color:var(--ink3);font-weight:500;margin-left:2px}
.sl{font-size:12px;color:var(--ink2);margin-top:6px}
.wdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--ink3);font-weight:600}
.wd i{width:100%;max-width:34px;height:8px;border-radius:99px;background:rgba(17,17,17,.08)}
.wd.on i{background:var(--ink)}
.wd.now span{color:var(--ink)}
.wd.later i{opacity:.45}
.yscroll{overflow-x:auto;margin-top:10px;padding-bottom:6px;scrollbar-width:none}
.yscroll::-webkit-scrollbar{display:none}
.ymonths{display:grid;gap:0;font-size:10.5px;color:var(--ink3);margin-bottom:4px;white-space:nowrap}
.ygrid{display:flex;gap:3px}
.ycol{display:grid;grid-template-rows:repeat(7,11px);gap:3px}
.ycol i,.ylegend i{width:11px;height:11px;border-radius:3px;background:rgba(17,17,17,.07);display:block}
.ycol i.off{background:transparent}
.l1{background:rgba(17,17,17,.3)!important}.l2{background:rgba(17,17,17,.6)!important}.l3{background:var(--ink)!important}
.ylegend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--ink3);margin-top:6px}
.ylegend span{margin:0 4px}
/* avatar */
.avcard{display:grid;gap:16px}
.avwrap{max-width:250px;width:100%;margin:0 auto}
.avsvg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 24px rgba(70,52,28,.12))}
.avlvl{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.02em}
.coins{text-align:right;display:grid}
.coins b{font-family:var(--disp);font-size:24px;font-weight:600}
.coins span{font-size:11.5px;color:var(--ink2)}
.earn{display:grid}
.erow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.erow:last-child{border-bottom:none}
.erow.got{color:var(--ink);font-weight:600}
.tick{width:22px;height:22px;border-radius:99px;border:1.5px solid rgba(20,20,20,.2);display:grid;place-items:center;flex:none}
.erow.got .tick{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scrollx::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--glassLine);background:var(--glass);border-radius:99px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.swatches{display:flex;gap:10px;margin-top:8px}

<script>
"use strict";
/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0 = n => Math.round(Number(n) || 0);
const r1 = n => Math.round((Number(n) || 0) * 10) / 10;
const dayStr = (d = new Date()) => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0, 10); };
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return dayStr(d); };
const niceDay = s => { const t = dayStr(); if (s === t) return "Today"; if (s === addDays(t, -1)) return "Yesterday";
  return new Date(s + "T12:00:00").toLocaleDateString(undefined, {weekday: "short", day: "numeric", month: "short"}); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const ICON = {
  today: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',

  body: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><path d="M5 9h14M12 9v6M8 21l4-6 4 6"/></svg>',
  activity: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',

  left: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',

  train: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
  barcode: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7V5h3M17 5h3v2M20 17v2h-3M7 19H4v-2M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>',
  flame: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.2 1-3.8 2.3-5 .2 1.6 1 2.8 2.2 3.3C11 8.6 11.2 5 12 2z"/></svg>',
  medal: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="6"/><path d="M8.5 9.2 6 3h4l2 4 2-4h4l-2.5 6.2"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/></svg>',
};

/* ---------------- targets (Mifflin-St Jeor) ---------------- */
const ACT = {low: [1.2, "Mostly sitting"], light: [1.375, "Light (1-3 workouts/wk)"], active: [1.55, "Active (3-5/wk)"], very: [1.725, "Very active (6-7/wk)"]};
const GOALS = {lose: "Lose fat", maintain: "Stay in shape", gain: "Build muscle"};
function targets(p) {
  const w = +p.weight || 75, h = +p.height || 175, a = +p.age || 30;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === "female" ? -161 : 5);
  const tdee = bmr * (ACT[p.activity] || ACT.light)[0];
  const floor = p.sex === "female" ? 1400 : 1700;           // never suggest crash diets
  let kcal = p.goal === "lose" ? Math.max(floor, tdee - 450) : p.goal === "gain" ? tdee + 250 : tdee;
  const mode = p.kcal_mode || (p.kcal_override ? "manual" : "ai");
  let protein = Math.round(w * (p.goal === "maintain" ? 1.6 : 2.0));
  if (mode === "manual" && p.kcal_override) kcal = +p.kcal_override;
  else if (mode === "ai" && p.ai_target?.kcal) { kcal = +p.ai_target.kcal; if (p.ai_target.protein) protein = +p.ai_target.protein; }
  kcal = Math.round(kcal / 10) * 10;
  const fat = Math.round(kcal * 0.27 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return {kcal, protein, carbs, fat, tdee: Math.round(tdee), steps: 8000};
}

/* ---------------- data layer: demo (this device) or live (Supabase) ---------------- */
const CFG = window.FORMA_CONFIG || {};
const LIVE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
const sb = LIVE ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
const S = { user: null, profile: null, entries: [], tab: ls.get("forma.tab", "today"), foodDay: dayStr(), demo: !LIVE };

function demoSeed() {
  const t = dayStr(), E = [];
  const add = (kind, day, data) => E.push({id: uid(), kind, day, data, created_at: new Date(day + "T12:00:00").toISOString()});
  let w = 82.4;
  for (let i = 60; i >= 0; i -= 2) { w -= 0.06 + (Math.sin(i) * 0.12); add("weight", addDays(t, -i), {kg: r1(w)}); }
  for (let i = 13; i >= 0; i--) {
    const d = addDays(t, -i), s = 5200 + Math.round(4800 * Math.abs(Math.sin(i * 1.7)));
    add("health", d, {steps: s, active_kcal: Math.round(s * 0.045 + 120), exercise_min: Math.round(s / 300), resting_hr: 58 + (i % 4), sleep_h: r1(6.4 + (i % 3) * 0.5),
      workouts: i % 2 ? [] : [{type: ["Strength training", "Running", "Cycling"][i % 3], minutes: 35 + (i % 3) * 10, kcal: 260 + (i % 3) * 60}]});
  }
  add("meal", t, {meal: "breakfast", name: "Greek yogurt bowl", items: [
    {name: "Greek yogurt", grams: 200, kcal: 146, p: 20, c: 8, f: 4}, {name: "Blueberries", grams: 80, kcal: 46, p: 1, c: 12, f: 0},
    {name: "Granola", grams: 40, kcal: 180, p: 4, c: 26, f: 7}]});
  add("meal", t, {meal: "lunch", name: "Chicken rice bowl", items: [
    {name: "Grilled chicken breast", grams: 150, kcal: 248, p: 46, c: 0, f: 5}, {name: "White rice", grams: 180, kcal: 234, p: 5, c: 51, f: 1},
    {name: "Broccoli", grams: 100, kcal: 34, p: 3, c: 7, f: 0}, {name: "Teriyaki sauce", grams: 30, kcal: 45, p: 1, c: 9, f: 0}]});
  add("scan", addDays(t, -28), {bf_low: 19, bf_high: 22, summary: "Solid base with good shoulder width. Midsection holds most of the body fat.",
    strengths: ["Broad shoulders", "Good leg development"], focus: ["Upper chest", "Core and waist"], plan: ["Keep protein near 160 g a day", "Add 2 incline press sessions a week", "Walk 8-10k steps daily"]});
  return {profile: {name: "Alex", sex: "male", age: 29, height: 180, weight: 79, goal: "lose", activity: "active", sync_token: "demo-" + uid().slice(0, 12)}, entries: E};
}

const DB = {
  async init() {
    if (!LIVE) {
      let st = ls.get("forma.demo", null);
      if (!st) { st = demoSeed(); ls.set("forma.demo", st); }
      S.user = {id: "demo", email: "demo"}; S.profile = st.profile; S.entries = st.entries; return;
    }
    const {data} = await sb.auth.getSession();
    S.user = data.session?.user || null;
    if (S.user) await DB.load();
  },
  async load() {
    const [{data: prof}, {data: ents, error}] = await Promise.all([
      sb.from("profiles").select("*").eq("user_id", S.user.id).maybeSingle(),
      sb.from("entries").select("*").gte("day", addDays(dayStr(), -120)).order("created_at")]);
    if (error) throw error;
    const {data: older} = await sb.from("entries").select("*").in("kind", ["health", "workout"]).gte("day", dayStr().slice(0, 4) + "-01-01").lt("day", addDays(dayStr(), -120)).order("created_at");
    if (older?.length) ents.unshift(...older);
    S.profile = prof ? {...prof.data, sync_token: prof.sync_token} : null;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; if (S.profile && tz && S.profile.tz !== tz) DB.saveProfile({tz}).catch(() => {});
    S.entries = ents || [];
  },
  saveDemo() { ls.set("forma.demo", {profile: S.profile, entries: S.entries}); },
  async saveProfile(p) {
    S.profile = {...S.profile, ...p};
    if (!LIVE) return DB.saveDemo();
    const {sync_token, ...data} = S.profile;
    const {data: row, error} = await sb.from("profiles").upsert({user_id: S.user.id, data}, {onConflict: "user_id"}).select().single();
    if (error) throw error;
    S.profile.sync_token = row.sync_token;
  },
  async add(kind, day, data) {
    const e = {id: uid(), kind, day, data, created_at: new Date().toISOString()};
    if (LIVE) { const {data: row, error} = await sb.from("entries").insert({user_id: S.user.id, kind, day, data}).select().single(); if (error) throw error; Object.assign(e, row); }
    S.entries.push(e); if (!LIVE) DB.saveDemo(); return e;
  },
  async remove(id) {
    if (LIVE) { const {error} = await sb.from("entries").delete().eq("id", id); if (error) throw error; }
    S.entries = S.entries.filter(e => e.id !== id); if (!LIVE) DB.saveDemo();
  },
  async wipe() {
    if (LIVE) { await sb.from("entries").delete().eq("user_id", S.user.id); await sb.from("profiles").delete().eq("user_id", S.user.id); }
    S.entries = []; S.profile = null; if (!LIVE) ls.set("forma.demo", {profile: null, entries: []});
  },
};
const of = (kind, day) => S.entries.filter(e => e.kind === kind && (!day || e.day === day));
const healthOf = day => { const h = of("health", day); return h.length ? h[h.length - 1].data : null; };
const mealTotals = m => (m.data.items || []).reduce((a, i) => ({kcal: a.kcal + (+i.kcal || 0), p: a.p + (+i.p || 0), c: a.c + (+i.c || 0), f: a.f + (+i.f || 0)}), {kcal: 0, p: 0, c: 0, f: 0});
const dayTotals = day => of("meal", day).map(mealTotals).reduce((a, t) => ({kcal: a.kcal + t.kcal, p: a.p + t.p, c: a.c + t.c, f: a.f + t.f}), {kcal: 0, p: 0, c: 0, f: 0});
const latestWeight = () => { const w = of("weight").sort((a, b) => a.day < b.day ? -1 : 1); return w.length ? w[w.length - 1].data.kg : +S.profile?.weight; };

/* ---------------- AI (Gemini via the app's server; demo answers on this device) ---------------- */
async function ai(type, payload) {
  if (!LIVE) {
    await sleep(1400);
    if (type === "text") { const t = (payload.context?.text || "").toLowerCase();
      if (/energy|monster|red ?bull/.test(t)) return {name: "Energy drink (500 ml)", meal: guessMeal(), items: [{name: "Energy drink", grams: 500, kcal: 230, p: 0, c: 55, f: 0}]};
      return {name: payload.context?.text || "Snack", meal: guessMeal(), items: [{name: payload.context?.text || "Snack", grams: 150, kcal: 250, p: 8, c: 30, f: 10}]}; }
    if (type === "calories") { const b = targets({...S.profile, kcal_mode: "auto"}); return {kcal: b.kcal, protein: b.protein, why: "Demo: about 450 kcal under what you burn, for steady fat loss of roughly 0.4 kg a week while keeping muscle."}; }
    if (type === "food") return {name: "Pasta with tomato sauce", meal: guessMeal(), items: [
      {name: "Spaghetti (cooked)", grams: 220, kcal: 348, p: 13, c: 68, f: 2}, {name: "Tomato basil sauce", grams: 120, kcal: 90, p: 2, c: 13, f: 3},
      {name: "Parmesan", grams: 15, kcal: 62, p: 5, c: 0, f: 4}, {name: "Olive oil", grams: 7, kcal: 62, p: 0, c: 0, f: 7}], note: "Demo result: sign in to analyse your own photos."};
    if (type === "physique") return {bf_low: 17, bf_high: 20, summary: "Demo result: steady progress since your last check, with a leaner waist and more visible shoulders.",
      strengths: ["Shoulders and arms", "Posture looks upright"], focus: ["Upper chest", "Lower abs and obliques"], plan: ["Stay near your calorie target 5-6 days a week", "Progressive overload on presses", "Keep 8k+ steps a day"]};
    return {tip: "You're 34 g short on protein today. A shake or 200 g of skyr closes the gap before dinner.", demo: true};
  }
  const {data} = await sb.auth.getSession();
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/ai", {method: "POST",
    headers: {"Content-Type": "application/json", Authorization: "Bearer " + data.session.access_token, apikey: CFG.SUPABASE_ANON_KEY},
    body: JSON.stringify({type, ...payload})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "The AI is busy, try again in a minute");
  return j;
}
const guessMeal = () => { const h = new Date().getHours(); return h < 11 ? "breakfast" : h < 15 ? "lunch" : h < 18 ? "snack" : "dinner"; };
function shrink(file, max = 1024, q = 0.82) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => {
    const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    res(c.toDataURL("image/jpeg", q)); URL.revokeObjectURL(img.src); }; img.onerror = () => rej(new Error("Couldn't read that photo")); img.src = URL.createObjectURL(file); });
}
function pickPhoto() { return new Promise(res => { const f = $("#fileIn"); f.value = ""; f.onchange = () => res(f.files[0] || null); f.click(); }); }

/* ---------------- charts ---------------- */
function lineChart(pts, {w = 520, h = 150, unit = ""} = {}) {
  if (pts.length < 2) return '<div class="empty">Log at least two days to see your trend.</div>';
  const ys = pts.map(p => p.y), lo = Math.min(...ys), hi = Math.max(...ys), pad = Math.max(0.5, (hi - lo) * 0.15);
  const y0 = lo - pad, y1 = hi + pad, L = 34, R = 10, T = 10, B = 22;
  const xs = pts.map(p => p.x), x0 = Math.min(...xs), x1 = Math.max(...xs) || 1;
  const X = x => L + (x - x0) / ((x1 - x0) || 1) * (w - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (h - T - B);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const area = d + ` L${X(pts.at(-1).x).toFixed(1)} ${h - B} L${X(pts[0].x).toFixed(1)} ${h - B} Z`;
  const grid = [y0 + pad, (y0 + y1) / 2, y1 - pad].map(v => `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${r1(v)}</text>`).join("");
  const last = pts.at(-1);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend chart">${grid}
    <path d="${area}" fill="var(--accentSoft)" opacity=".7"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
    <text x="${L}" y="${h - 6}">${esc(pts[0].label || "")}</text><text x="${w - R}" y="${h - 6}" text-anchor="end">${esc(last.label || "")}</text></svg>`;
}
function barChart(vals, labels, goal, {w = 520, h = 150} = {}) {
  const mx = Math.max(goal || 0, ...vals, 1) * 1.1, L = 8, R = 8, T = 10, B = 22, bw = (w - L - R) / vals.length;
  const Y = v => T + (1 - v / mx) * (h - T - B);
  const bars = vals.map((v, i) => `<rect x="${(L + i * bw + bw * 0.18).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${(h - B - Y(v)).toFixed(1)}" rx="5"
     fill="${v >= goal ? "var(--accent)" : "var(--accent2)"}" opacity="${v >= goal ? 1 : .55}"/><text x="${(L + i * bw + bw / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle">${esc(labels[i])}</text>`).join("");
  const g = goal ? `<line x1="${L}" x2="${w - R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ink3)" stroke-dasharray="4 4"/><text x="${w - R}" y="${Y(goal) - 4}" text-anchor="end">goal ${goal.toLocaleString()}</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Steps per day">${bars}${g}</svg>`;
}
function ring(eaten, target) {
  const R = 64, C = 2 * Math.PI * R, p = Math.min(1, eaten / (target || 1)), over = eaten > target;
  return `<div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--bg2)" stroke-width="13"/>
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="${over ? "var(--red)" : "var(--accent)"}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}"/></svg>
    <div class="mid"><span class="big num">${r0(Math.abs(target - eaten)).toLocaleString()}</span><span class="sub">${over ? "kcal over" : "kcal left"}</span></div></div>`;
}

/* ---------------- screens ---------------- */
const TABS = [["today", "Today"], ["food", "Food"], ["body", "Avatar"], ["activity", "Train"], ["profile", "Me"]];
const TAB_ICON = {activity: "train"};
function nav() {
  const n = $("#tabs"); n.hidden = false;
  n.firstElementChild.innerHTML = TABS.map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}">${ICON[TAB_ICON[k] || k]}${l}</button>`).join("");
}
function go(tab) { S.tab = tab; ls.set("forma.tab", tab); render(); scrollTo({top: 0}); }
const demoBanner = () => S.demo ? `<div class="demo"><span class="grow">Example data: this is a demo with a sample person. Your own data starts when the app is connected.</span></div>` : "";

function render() {
  const v = $("#view");
  $("#avatarBtn").textContent = (S.profile?.name || "A")[0].toUpperCase();
  $("#avatarBtn").hidden = !S.profile;
  if (LIVE && !S.user) { $("#tabs").hidden = true; return renderAuth(v); }
  if (!S.profile) { $("#tabs").hidden = true; return renderOnboarding(v); }
  nav();
  const stk = streak(), sb2 = $("#streakBtn");
  sb2.hidden = !stk; sb2.innerHTML = `${ICON.flame}${stk}`; sb2.title = `${stk}-day logging streak`;
  setTimeout(checkBadges, 0);
  ({today: renderToday, food: renderFood, body: renderBody, activity: renderActivity, profile: renderProfile}[S.tab] || renderToday)(v);
}

function renderAuth(v) {
  let mode = "in";
  const draw = () => { v.innerHTML = `<form class="auth card" id="authForm">
    <div><div class="eyebrow">Welcome to FORMA</div><h1>${mode === "in" ? "Sign in" : "Create your account"}</h1>
    <div class="sub">Calories from a photo, physique check-ins and your Apple Watch, in one place.</div></div>
    <label class="f">Email<input class="in" id="em" type="email" autocomplete="email" required></label>
    <label class="f">Password<input class="in" id="pw" type="password" minlength="8" autocomplete="${mode === "in" ? "current-password" : "new-password"}" required></label>
    <button class="btn block" id="authGo">${mode === "in" ? "Sign in" : "Create account"}</button>
    <button type="button" class="link" id="authSwap">${mode === "in" ? "New here? Create an account" : "Already have an account? Sign in"}</button>
    <div class="sub" id="authMsg"></div></form>`;
    $("#authSwap").onclick = () => { mode = mode === "in" ? "up" : "in"; draw(); };
    $("#authForm").onsubmit = async e => { e.preventDefault(); const b = $("#authGo"); b.disabled = true; $("#authMsg").textContent = "";
      const cred = {email: $("#em").value.trim(), password: $("#pw").value};
      const {data, error} = mode === "in" ? await sb.auth.signInWithPassword(cred) : await sb.auth.signUp(cred);
      b.disabled = false;
      if (error) { $("#authMsg").textContent = error.message; return; }
      if (!data.session) { $("#authMsg").textContent = "Check your email to confirm your account, then sign in."; return; }
      S.user = data.session.user; await DB.load(); render(); };
  };
  draw();
}

function profileForm(p = {}) {
  return `<div class="fgrid">
    <label class="f" style="grid-column:1/-1">Your name<input class="in" id="pName" value="${esc(p.name || "")}" required></label>
    <label class="f">Sex<select class="in" id="pSex"><option value="male"${p.sex !== "female" ? " selected" : ""}>Male</option><option value="female"${p.sex === "female" ? " selected" : ""}>Female</option></select></label>
    <label class="f">Age<input class="in num" id="pAge" type="number" min="13" max="100" value="${esc(p.age || "")}" required></label>
    <label class="f">Height (cm)<input class="in num" id="pH" type="number" min="120" max="230" value="${esc(p.height || "")}" required></label>
    <label class="f">Weight (kg)<input class="in num" id="pW" type="number" step="0.1" min="35" max="300" value="${esc(p.weight || "")}" required></label>
    <label class="f" style="grid-column:1/-1">Goal<select class="in" id="pGoal">${Object.entries(GOALS).map(([k, l]) => `<option value="${k}"${p.goal === k ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    <label class="f" style="grid-column:1/-1">How active are you?<select class="in" id="pAct">${Object.entries(ACT).map(([k, [, l]]) => `<option value="${k}"${(p.activity || "light") === k ? " selected" : ""}>${l}</option>`).join("")}</select></label>
  </div>`;
}
const readProfileForm = () => ({name: $("#pName").value.trim(), sex: $("#pSex").value, age: +$("#pAge").value, height: +$("#pH").value,
  weight: +$("#pW").value, goal: $("#pGoal").value, activity: $("#pAct").value});

function renderOnboarding(v) {
  v.innerHTML = `<form class="stack" id="ob"><div><div class="eyebrow">Step 1 of 1</div><h1>Let's set your targets</h1>
    <div class="sub">FORMA works out your daily calories and protein from this. You can change it any time.</div></div>
    <div class="card">${profileForm()}</div><button class="btn block">Start</button></form>`;
  $("#ob").onsubmit = async e => { e.preventDefault(); const p = readProfileForm();
    try { await DB.saveProfile(p); await DB.add("weight", dayStr(), {kg: p.weight}); go("today"); } catch (err) { toast(err.message); } };
}

function renderToday(v) {
  const t = dayStr(), tg = targets(S.profile), tot = dayTotals(t), h = healthOf(t);
  const stk = streak();
  const hello = new Date().getHours() < 12 ? "Good morning" : new Date().getHours() < 18 ? "Good afternoon" : "Good evening";
  const macro = (l, val, goal, col) => `<div class="macro"><div class="lbl"><span>${l}</span><span class="num">${r0(val)} / ${goal} g</span></div><div class="bar"><i style="width:${Math.min(100, val / goal * 100)}%;background:${col}"></i></div></div>`;
  const tile = (l, n, unit = "") => `<div class="tile"><div class="l">${l}</div><div class="n num">${n}<span class="sub"> ${unit}</span></div></div>`;
  v.innerHTML = `${demoBanner()}
    <div><div class="sub">${new Date().toLocaleDateString(undefined, {weekday: "long", day: "numeric", month: "long"})}</div><h1>${hello}, ${esc(S.profile.name)}</h1></div>
    <div class="card hero" style="margin-top:12px">${ring(tot.kcal, tg.kcal)}
      <div class="stack" style="gap:10px"><div class="row between"><span class="eyebrow">Eaten</span><span class="num" style="font-weight:700;white-space:nowrap;font-size:14px">${r0(tot.kcal).toLocaleString()} / ${tg.kcal.toLocaleString()}</span></div>
      <div class="row between"><span class="eyebrow">Burned (Watch)</span><span class="num" style="font-weight:700;font-size:14px">${h && h.active_kcal != null ? r0(h.active_kcal).toLocaleString() + " kcal" : "–"}</span></div>
      ${macro("Protein", tot.p, tg.protein, "var(--accent)")}${macro("Carbs", tot.c, tg.carbs, "var(--blue)")}${macro("Fat", tot.f, tg.fat, "var(--amber)")}</div></div>
    ${stk && !of("meal", t).length ? `<div class="demo" style="margin-top:12px;background:var(--accentSoft);color:var(--accent)">${ICON.flame}<span class="grow">Your ${stk}-day streak is waiting. Log a meal today to keep it going.</span></div>` : ""}
    <div style="margin-top:12px">${quickAddBox("qa")}</div>
    <div class="quick" style="margin-top:12px">
      <button id="qMeal">${ICON.camera}Snap meal</button><button id="qScan">${ICON.barcode}Barcode</button><button id="qWeight">${ICON.scale}Weight</button><button id="qBody">${ICON.body}Body check</button></div>
    <h2>Training</h2>${trainingSummary(false)}
    <h2>From your Apple Watch <span class="pill ${h ? "green" : "amber"}">${ICON.watch}${h ? "Synced" : "Not synced today"}</span></h2>
    ${h ? `<div class="tiles">${tile("Steps", r0(h.steps).toLocaleString())}${tile("Active energy", r0(h.active_kcal), "kcal")}${tile("Exercise", r0(h.exercise_min), "min")}${tile("Resting heart rate", r0(h.resting_hr) || "–", "bpm")}</div>`
        : `<div class="card"><div class="sub">Your Watch data arrives once a day through a free Apple Shortcut.</div><button class="btn ghost small" style="margin-top:10px" id="toSync">Set up Apple Watch sync</button></div>`}
    <h2>Coach</h2>
    <div class="card coach"><div class="stack" style="gap:10px"><div id="tipText" style="font-weight:600">Get one clear thing to do today, based on what you've eaten and how much you've moved.</div>
      <div><button class="btn small" id="tipGo">Get today's tip</button></div></div></div>`;
  bindQuickAdd("qa"); $("#qMeal").onclick = snapMeal; $("#qScan").onclick = scanBarcode; $("#qWeight").onclick = weightSheet; $("#qBody").onclick = physiqueCheck;
  if ($("#toSync")) $("#toSync").onclick = () => go("activity");
  $("#tipGo").onclick = async () => { const b = $("#tipGo"); b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
    try { const r = await ai("coach", {context: coachContext()}); $("#tipText").textContent = r.tip; }
    catch (e) { toast(e.message); } b.disabled = false; b.textContent = "New tip"; };
}
function coachContext() {
  const t = dayStr(), tg = targets(S.profile), tot = dayTotals(t);
  const week = [...Array(7)].map((_, i) => healthOf(addDays(t, -i))).filter(Boolean);
  return {goal: GOALS[S.profile.goal], targets: tg, eaten_today: tot, hour: new Date().getHours(), weight_now: latestWeight(),
    avg_steps_7d: week.length ? r0(week.reduce((a, h) => a + (h.steps || 0), 0) / week.length) : null,
    workouts_7d: week.reduce((a, h) => a + (h.workouts || []).length, 0)};
}

/* ---- food ---- */
function renderFood(v) {
  const d = S.foodDay, tot = dayTotals(d), tg = targets(S.profile), meals = of("meal", d);
  const order = ["breakfast", "lunch", "snack", "dinner"];
  const groups = order.map(m => [m, meals.filter(x => (x.data.meal || "snack") === m)]).filter(([, l]) => l.length);
  v.innerHTML = `${demoBanner()}
    <div class="daynav" style="margin-top:6px"><button class="icon-btn" id="dPrev" aria-label="Previous day">${ICON.left}</button>
      <div style="text-align:center"><h1 style="margin:0">${niceDay(d)}</h1><div class="sub num">${r0(tot.kcal).toLocaleString()} of ${tg.kcal.toLocaleString()} kcal · ${r0(tot.p)} g protein</div></div>
      <button class="icon-btn" id="dNext" aria-label="Next day" ${d >= dayStr() ? "disabled" : ""}>${ICON.right}</button></div>
    <div class="row" style="margin-top:14px"><button class="btn grow" id="snap">${ICON.camera}Snap a meal</button><button class="btn ghost" id="scanBc" aria-label="Scan a barcode">${ICON.barcode}</button><button class="btn ghost" id="manual">Manual</button></div>
    <div style="margin-top:10px">${quickAddBox("qaF")}</div>
    ${groups.length ? groups.map(([m, list]) => `<h2>${m[0].toUpperCase() + m.slice(1)}<span class="sub num">${r0(list.map(mealTotals).reduce((a, t) => a + t.kcal, 0))} kcal</span></h2>
      <div class="card list">${list.map(x => { const t = mealTotals(x); return `<div class="li">${x.data.thumb ? `<img src="${x.data.thumb}" alt="">` : `<div class="ph">${ICON.food}</div>`}
        <div class="grow"><div class="t">${esc(x.data.name || "Meal")}</div><div class="d num">P ${r0(t.p)} · C ${r0(t.c)} · F ${r0(t.f)} · ${(x.data.items || []).length} items</div></div>
        <span class="kcal">${r0(t.kcal)}</span><button class="x" data-del="${x.id}" aria-label="Delete meal">×</button></div>`; }).join("")}</div>`).join("")
      : `<div class="card empty" style="margin-top:14px">Nothing logged for ${niceDay(d).toLowerCase()}. Snap a photo of your plate and FORMA works out the calories.</div>`}`;
  $("#dPrev").onclick = () => { S.foodDay = addDays(d, -1); render(); };
  $("#dNext").onclick = () => { if (d < dayStr()) { S.foodDay = addDays(d, 1); render(); } };
  $("#snap").onclick = snapMeal; $("#scanBc").onclick = scanBarcode; bindQuickAdd("qaF", S.foodDay);
  $("#manual").onclick = () => mealSheet({name: "", meal: guessMeal(), items: [{name: "", grams: 100, kcal: 0, p: 0, c: 0, f: 0}]}, null);
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => confirmSheet("Delete this meal?", async () => { await DB.remove(b.dataset.del); render(); }));
}
async function snapMeal() {
  const f = await pickPhoto(); if (!f) return;
  const img = await shrink(f), thumb = await shrink(f, 160, 0.7);
  sheet(`<h3>Reading your plate…</h3><img class="photo-prev" src="${img}" alt="Your meal"><div class="row" style="margin-top:14px"><span class="spinner"></span><span class="sub">Spotting each food and estimating portions</span></div>`);
  try { const r = await ai("food", {image: img}); closeSheet(); mealSheet({name: r.name, meal: r.meal || guessMeal(), items: r.items || [], note: r.note, thumb}, img); }
  catch (e) { closeSheet(); toast(e.message); }
}
function mealSheet(m, img) {
  const rows = () => m.items.map((it, i) => `<input class="in" data-i="${i}" data-k="name" value="${esc(it.name)}" placeholder="Food" aria-label="Food name">
    <input class="in num" data-i="${i}" data-k="grams" type="number" value="${r0(it.grams)}" aria-label="Grams">
    <input class="in num" data-i="${i}" data-k="kcal" type="number" value="${r0(it.kcal)}" aria-label="Calories">
    <input class="in num" data-i="${i}" data-k="p" type="number" value="${r0(it.p)}" aria-label="Protein">
    <input class="in num" data-i="${i}" data-k="c" type="number" value="${r0(it.c)}" aria-label="Carbs">
    <button class="x" data-rm="${i}" aria-label="Remove">×</button>`).join("");
  const draw = () => {
    const t = m.items.reduce((a, i) => ({kcal: a.kcal + (+i.kcal || 0), p: a.p + (+i.p || 0)}), {kcal: 0, p: 0});
    sheet(`<h3>${img ? "Here's what I see" : "Add a meal"}</h3>${m.note ? `<div class="sub">${esc(m.note)}</div>` : `<div class="sub">Check the portions and fix anything that looks off.</div>`}
      ${img ? `<img class="photo-prev" src="${img}" alt="Your meal" style="margin-top:10px;max-height:170px">` : ""}
      <div class="fgrid" style="margin-top:12px"><label class="f">Name<input class="in" id="mName" value="${esc(m.name)}"></label>
      <label class="f">Meal<select class="in" id="mMeal">${["breakfast", "lunch", "snack", "dinner"].map(x => `<option${m.meal === x ? " selected" : ""}>${x}</option>`).join("")}</select></label></div>
      <div style="overflow-x:auto;margin-top:12px"><div class="item-edit" style="min-width:330px"><span class="h">Food</span><span class="h">g</span><span class="h">kcal</span><span class="h">P</span><span class="h">C</span><span></span>${rows()}</div></div>
      <button class="link" id="addItem" style="margin-top:10px">+ Add a food</button>
      <div class="row between" style="margin-top:14px"><span class="num" style="font-weight:800">${r0(t.kcal)} kcal · ${r0(t.p)} g protein</span></div>
      <div class="row" style="margin-top:12px"><button class="btn ghost grow" id="mCancel">Cancel</button><button class="btn grow" id="mSave">Save meal</button></div>`);
    document.querySelectorAll(".item-edit input").forEach(inp => inp.onchange = () => {
      const it = m.items[+inp.dataset.i], k = inp.dataset.k, old = {...it};
      it[k] = k === "name" ? inp.value : +inp.value;
      if (k === "grams" && old.grams > 0) { const s = it.grams / old.grams; ["kcal", "p", "c", "f"].forEach(q => it[q] = r1(old[q] * s)); }
      m.name = $("#mName").value; m.meal = $("#mMeal").value; draw(); });
    document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { m.items.splice(+b.dataset.rm, 1); draw(); });
    $("#addItem").onclick = () => { m.name = $("#mName").value; m.meal = $("#mMeal").value; m.items.push({name: "", grams: 100, kcal: 0, p: 0, c: 0, f: 0}); draw(); };
    $("#mCancel").onclick = closeSheet;
    $("#mSave").onclick = async () => { const items = m.items.filter(i => i.name && (+i.kcal || 0) >= 0);
      if (!items.length) return toast("Add at least one food");
      try { await DB.add("meal", S.foodDay || dayStr(), {name: $("#mName").value || items[0].name, meal: $("#mMeal").value, items, thumb: m.thumb || null});
        closeSheet(); toast("Meal saved"); render(); } catch (e) { toast(e.message); } };
  };
  draw();
}

/* ---- body ---- */
function renderBody(v) {
  const ws = of("weight").sort((a, b) => a.day < b.day ? -1 : 1), now = latestWeight();
  const t = dayStr(), since = ws.filter(w => w.day >= addDays(t, -30)), ch = since.length > 1 ? r1(since.at(-1).data.kg - since[0].data.kg) : null;
  const pts = ws.filter(w => w.day >= addDays(t, -90)).map(w => ({x: new Date(w.day).getTime() / 864e5, y: +w.data.kg, label: niceDay(w.day)}));
  const scans = of("scan").sort((a, b) => a.day < b.day ? 1 : -1);
  v.innerHTML = `${demoBanner()}<h1>Avatar</h1>${avatarSection()}<h2>Progress</h2>
    <div class="card" style="margin-top:10px"><div class="row between"><div><div class="eyebrow">Weight</div><div class="bf num">${r1(now)} <span class="sub">kg</span></div></div>
      ${ch !== null ? `<span class="pill ${(S.profile.goal === "gain" ? ch >= 0 : ch <= 0) ? "green" : "amber"} num">${ch > 0 ? "+" : ""}${ch} kg in 30 days</span>` : ""}</div>
      <div style="margin-top:8px">${lineChart(pts)}</div><button class="btn ghost small" id="logW" style="margin-top:8px">${ICON.scale}Log today's weight</button></div>
    <h2>Physique check-ins <button class="btn small" id="newScan">${ICON.camera}New check-in</button></h2>
    <div class="sub" style="margin:-4px 2px 10px">Take a front photo in good light, same spot each time. Every 2-4 weeks is ideal. Photos stay private to your account.</div>
    ${scans.length ? `<div class="stack">${scans.map(scanCard).join("")}</div>` : `<div class="card empty">No check-ins yet. Your first one becomes the baseline for tracking progress.</div>`}`;
  $("#logW").onclick = weightSheet; $("#newScan").onclick = physiqueCheck; bindAvatar();
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => confirmSheet("Delete this check-in?", async () => { await DB.remove(b.dataset.del); render(); }));
}
const scanCard = s => `<div class="card"><div class="row">${s.data.thumb ? `<img src="${s.data.thumb}" alt="" style="width:64px;height:84px;object-fit:cover;border-radius:12px">` : ""}
  <div class="grow"><div class="eyebrow">${niceDay(s.day)}</div><div style="font-weight:800;font-size:20px" class="num">${s.data.bf_low}–${s.data.bf_high}% <span class="sub">est. body fat</span></div>
  <div class="sub">${esc(s.data.summary)}</div></div><button class="x" data-del="${s.id}" aria-label="Delete check-in">×</button></div>
  <div class="fgrid" style="margin-top:10px"><div><div class="eyebrow">Strong points</div><ul class="list-plain">${(s.data.strengths || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
  <div><div class="eyebrow">Focus next</div><ul class="list-plain">${(s.data.focus || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
  ${(s.data.plan || []).length ? `<div style="margin-top:10px"><div class="eyebrow">Plan</div><ul class="list-plain">${s.data.plan.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}</div>`;
async function physiqueCheck() {
  const f = await pickPhoto(); if (!f) return;
  const img = await shrink(f, 1024), thumb = await shrink(f, 200, 0.7);
  sheet(`<h3>Checking your progress…</h3><img class="photo-prev" src="${img}" alt="Your check-in photo"><div class="row" style="margin-top:14px"><span class="spinner"></span><span class="sub">Comparing with your goal and last check-in</span></div>`);
  try {
    const prev = of("scan").sort((a, b) => a.day < b.day ? 1 : -1)[0];
    const r = await ai("physique", {image: img, context: {goal: GOALS[S.profile.goal], sex: S.profile.sex, age: S.profile.age, height: S.profile.height, weight: latestWeight(),
      previous: prev ? {day: prev.day, bf_low: prev.data.bf_low, bf_high: prev.data.bf_high, focus: prev.data.focus} : null}});
    await DB.add("scan", dayStr(), {...r, thumb}); closeSheet(); toast("Check-in saved"); go("body");
  } catch (e) { closeSheet(); toast(e.message); }
}
function weightSheet() {
  sheet(`<h3>Log weight</h3><div class="sub">Weigh in the morning, before breakfast, for the clearest trend.</div>
    <form id="wf" class="stack" style="margin-top:12px"><label class="f">Weight (kg)<input class="in num" id="wIn" type="number" step="0.1" min="35" max="300" value="${r1(latestWeight())}" required></label>
    <div class="row"><button type="button" class="btn ghost grow" id="wC">Cancel</button><button class="btn grow">Save</button></div></form>`);
  $("#wC").onclick = closeSheet;
  $("#wf").onsubmit = async e => { e.preventDefault(); const kg = r1($("#wIn").value);
    try { for (const w of of("weight", dayStr())) await DB.remove(w.id); await DB.add("weight", dayStr(), {kg}); await DB.saveProfile({weight: kg}); closeSheet(); toast("Weight saved"); render(); }
    catch (err) { toast(err.message); } };
}

/* ---- activity ---- */
function renderActivity(v) {
  const t = dayStr(), days = [...Array(7)].map((_, i) => addDays(t, i - 6));
  const hs = days.map(healthOf), steps = hs.map(h => r0(h?.steps)), tg = targets(S.profile);
  const wk = [];
  days.forEach((d, i) => (hs[i]?.workouts || []).forEach(w => wk.push({...w, day: d, src: "watch"})));
  of("workout").forEach(w => { if (w.day >= days[0]) wk.push({...w.data, day: w.day, id: w.id, src: "manual"}); });
  wk.sort((a, b) => a.day < b.day ? 1 : -1);
  const avg = steps.filter(Boolean).length ? r0(steps.reduce((a, b) => a + b, 0) / steps.filter(Boolean).length) : 0;
  const tok = S.profile.sync_token || "";
  const url = LIVE ? CFG.SUPABASE_URL + "/functions/v1/health-sync" : "https://your-project.supabase.co/functions/v1/health-sync";
  v.innerHTML = `${demoBanner()}<h1>Train</h1>
    ${trainingSummary(true)}
    ${caloriesCard()}
    <h2>Steps</h2>
    <div class="card"><div class="row between"><div><div class="eyebrow">Last 7 days</div><div class="bf num">${avg.toLocaleString()} <span class="sub">a day on average</span></div></div></div>
      ${barChart(steps, days.map(d => new Date(d + "T12:00:00").toLocaleDateString(undefined, {weekday: "narrow"})), tg.steps)}</div>
    <h2>Workouts this week <button class="btn ghost small" id="addW">+ Add</button></h2>
    <div class="card list">${wk.length ? wk.map(w => `<div class="li"><div class="ph">${ICON.activity}</div><div class="grow"><div class="t">${esc(w.type)}</div>
      <div class="d">${niceDay(w.day)} · ${r0(w.minutes)} min${w.kcal ? " · " + r0(w.kcal) + " kcal" : ""}${w.sets ? " · " + w.sets + " sets" : ""}</div></div>

/* ---------------- training days (from Apple Health / Fitness + manual) ---------------- */
const WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const wdOf = (s = dayStr()) => (new Date(s + "T12:00:00").getDay() + 6) % 7;
const allWorkouts = () => {
  const w = of("workout").map(e => ({day: e.day, minutes: +e.data.minutes || 0}));
  of("health").forEach(h => (h.data.workouts || []).forEach(x => w.push({day: h.day, minutes: +x.minutes || 0})));
  return w;
};
// minutes trained per day: logged workouts, or Apple exercise minutes (30+ counts as a training day)
function trainingMap() {
  const m = new Map();
  allWorkouts().forEach(w => m.set(w.day, (m.get(w.day) || 0) + Math.max(w.minutes, 1)));
  of("health").forEach(h => { const ex = +h.data.exercise_min || 0; if (ex >= 30 && ex > (m.get(h.day) || 0)) m.set(h.day, ex); });
  return m;
}
function trainingTotals() {
  const m = trainingMap(), t = dayStr(), mon = addDays(t, -wdOf(t)), month = t.slice(0, 7), year = t.slice(0, 4);
  let week = 0, mo = 0, yr = 0;
  for (const d of m.keys()) { if (d > t) continue; if (d >= mon) week++; if (d.startsWith(month)) mo++; if (d.startsWith(year)) yr++; }
  const dayOfYear = Math.round((new Date(t + "T12:00:00") - new Date(year + "-01-01T12:00:00")) / 864e5) + 1;
  return {m, week, month: mo, year: yr, dayOfMonth: +t.slice(8, 10), dayOfYear, mon};
}
function weekDots(m, mon) {
  const t = dayStr();
  return `<div class="wdots">${WD.map((d, i) => { const day = addDays(mon, i), on = m.has(day);
    return `<div class="wd ${on ? "on" : ""} ${day === t ? "now" : ""} ${day > t ? "later" : ""}"><i></i><span>${d.slice(0, 1)}</span></div>`; }).join("")}</div>`;
}
function yearGrid(m) {
  const t = dayStr(), year = t.slice(0, 4), start = addDays(year + "-01-01", -wdOf(year + "-01-01"));
  const weeks = Math.ceil((Math.round((new Date(t + "T12:00:00") - new Date(start + "T12:00:00")) / 864e5) + 1) / 7);
  let cols = "", months = "", lastMonth = "";
  for (let w = 0; w < weeks; w++) {
    const first = addDays(start, w * 7), mo = first.slice(5, 7);
    months += `<span>${mo !== lastMonth && first.slice(0, 4) === year ? new Date(first + "T12:00:00").toLocaleDateString(undefined, {month: "short"}) : ""}</span>`;
    lastMonth = mo;
    cols += `<div class="ycol">${[...Array(7)].map((_, i) => { const d = addDays(first, i);
      if (!d.startsWith(year) || d > t) return `<i class="off"></i>`;
      const min = m.get(d) || 0, lv = !min ? 0 : min < 30 ? 1 : min < 60 ? 2 : 3;
      return `<i class="l${lv}" title="${niceDay(d)}${min ? ": " + min + " min" : ""}"></i>`; }).join("")}</div>`;
  }
  return `<div class="yscroll" id="yscroll"><div class="ymonths" style="grid-template-columns:repeat(${weeks},14px)">${months}</div><div class="ygrid">${cols}</div></div>`;
}
function trainingSummary(full) {
  const T = trainingTotals();
  const stat = (n, of_, label) => `<div class="stat"><div class="sn num">${n}${of_ ? `<span>/${of_}</span>` : ""}</div><div class="sl">${label}</div></div>`;
  return `<div class="card train-card">
    ${full ? `<div class="ct">Training days</div><div class="sub">A day counts when your Watch logs a workout or 30+ exercise minutes, or you add one.</div>` : ""}
    <div class="stats" style="${full ? "" : "margin-top:0"}">${stat(T.week, 7, "This week")}${stat(T.month, 0, `days in ${new Date().toLocaleDateString(undefined, {month: "long"})}`)}${stat(T.year, 0, `days in ${new Date().getFullYear()}`)}</div>
    ${weekDots(T.m, T.mon)}
    ${full ? `<div class="ct" style="margin-top:18px">${new Date().getFullYear()} so far</div>${yearGrid(T.m)}
      <div class="ylegend"><span>Less</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><span>60+ min</span></div>` : ""}
  </div>`;
}

/* ---------------- streaks & badges ---------------- */
const mealDays = () => new Set(of("meal").map(e => e.day));
function streak() { if (!S.profile) return 0; const m = mealDays(); let d = dayStr(); if (!m.has(d)) d = addDays(d, -1); let n = 0; while (m.has(d)) { n++; d = addDays(d, -1); } return n; }
function bestStreak() { let best = 0, cur = 0, prev = null; for (const d of [...mealDays()].sort()) { cur = prev && addDays(prev, 1) === d ? cur + 1 : 1; best = Math.max(best, cur); prev = d; } return best; }
const BADGES = [
  ["first_meal", "First bite", "Log your first meal", c => [c.meals, 1]],
  ["streak3", "On a roll", "3-day logging streak", c => [c.best, 3]],
  ["streak7", "Week strong", "7-day logging streak", c => [c.best, 7]],
  ["streak30", "Habit locked", "30-day logging streak", c => [c.best, 30]],
  ["meals50", "Half century", "Log 50 meals", c => [c.meals, 50]],
  ["protein5", "Protein pro", "Hit protein 5 of the last 7 days", c => [c.protein, 5]],
  ["workout1", "First rep", "Finish a workout", c => [c.workouts, 1]],
  ["workouts10", "Ten down", "Finish 10 workouts", c => [c.workouts, 10]],
  ["week4", "Four-day week", "Train 4 days in one week", c => [c.week4, 1]],
  ["steps10k", "10k club", "10,000 steps in a day", c => [c.steps10k, 1]],
  ["scan1", "Baseline", "First physique check-in", c => [c.scans, 1]],
  ["weigh10", "Steady scale", "10 weigh-ins", c => [c.weighs, 10]],
];
function badges() {
  const t = dayStr(), tg = targets(S.profile), w = allWorkouts(), tm = trainingMap();
  let week4 = 0, protein = 0;
  for (let k = 0; k < 52 && !week4; k++) { const mon = addDays(t, -wdOf(t) - 7 * k), sun = addDays(mon, 6);
    if ([...tm.keys()].filter(d => d >= mon && d <= sun).length >= 4) week4 = 1; }
  for (let i = 0; i < 7; i++) if (dayTotals(addDays(t, -i)).p >= tg.protein * 0.95) protein++;
  const c = {meals: of("meal").length, best: bestStreak(), workouts: w.length, week4, protein, scans: of("scan").length, weighs: of("weight").length,
    steps10k: of("health").some(h => (+h.data.steps || 0) >= 10000) ? 1 : 0};
  return BADGES.map(([id, name, desc, f]) => { const [v, goal] = f(c); return {id, name, desc, v: Math.min(v, goal), goal, got: v >= goal}; });
}
function checkBadges() {
  if (!S.profile) return;
  const key = "forma.badges." + (S.user?.id || "demo"), prev = ls.get(key, null), seen = new Set(prev || []);
  const got = badges().filter(b => b.got), fresh = got.filter(b => !seen.has(b.id));
  got.forEach(b => seen.add(b.id)); ls.set(key, [...seen]);
  if (prev && fresh.length) toast("Badge unlocked: " + fresh.map(b => b.name).join(", "));
}

    const id = b.dataset.item || null, a = av(), slot = avTab;
    if (!id || a.owned.includes(id)) return save({eq: {...a.eq, [slot]: a.eq[slot] === id && ["head", "face", "extra"].includes(slot) ? null : id}});
    const it = ITEMS[id], P = avatarPoints(), lv = levelOf(P.xp);
    sheet(`<h3>${esc(it.name)}</h3><div class="sub">${it.price} points. You have ${P.coins.toLocaleString()}.</div>
      <div class="avwrap" style="max-width:220px;margin:14px auto 0">${avatarSVG(a, tierOf(lv.L), {[slot]: id})}</div>
      <div class="row" style="margin-top:16px"><button class="btn ghost grow" id="bC">Not now</button>
      <button class="btn grow" id="bY" ${P.coins < it.price ? "disabled" : ""}>${P.coins < it.price ? `Need ${it.price - P.coins} more` : `Buy for ${it.price}`}</button></div>`);
    $("#bC").onclick = closeSheet;
    $("#bY").onclick = async () => { closeSheet(); await save({owned: [...a.owned, id], spent: (a.spent || 0) + it.price, eq: {...a.eq, [slot]: id}}); toast(`${it.name} unlocked`); };
  });
}

/* ---------------- type what you ate: AI works out calories ---------------- */
function quickAddBox(id = "qa") {
  return `<form class="qa" id="${id}"><input class="in" id="${id}In" maxlength="120" autocomplete="off" placeholder="Type what you had, e.g. energy drink" aria-label="Type what you ate or drank">
    <button class="btn" aria-label="Add">Add</button></form>`;
}
function bindQuickAdd(id = "qa", day) {
  const f = $("#" + id); if (!f) return;
  f.onsubmit = async e => { e.preventDefault(); const inp = $("#" + id + "In"), text = inp.value.trim(), b = f.querySelector("button");
    if (text.length < 2) return toast("Type a food or drink first");
    b.disabled = true; b.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px"></span>';
    try {
      const r = await ai("text", {context: {text, hour: new Date().getHours()}});
      const items = (r.items || []).filter(i => i && i.name).map(i => ({name: String(i.name).slice(0, 60), grams: r0(i.grams), kcal: r0(i.kcal), p: r1(i.p), c: r1(i.c), f: r1(i.f)}));
      if (!items.length) throw new Error("Couldn't work that one out, try adding more detail");
      const total = items.reduce((s, i) => s + i.kcal, 0);
      await DB.add("meal", day || dayStr(), {name: String(r.name || text).slice(0, 60), meal: r.meal || guessMeal(), items, typed: text});
      toast(`Added ${r.name || text}: ${total} kcal`); render();
    } catch (err) { b.disabled = false; b.textContent = "Add"; toast(err.message); }
  };
}

/* ---- sheets ---- */
function sheet(html, opt = {}) { closeSheet(); const s = document.createElement("div"); s.className = "scrim"; s.id = "scrim";
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; if (!opt.sticky) s.onclick = e => { if (e.target === s) closeSheet(); }; document.body.appendChild(s); }
function closeSheet() {
  if (S.tick) { clearInterval(S.tick); S.tick = null; }
  if (S.scanner) { const q = S.scanner; S.scanner = null; try { if (q.isScanning) q.stop().then(() => q.clear()).catch(() => {}); } catch {} }
  $("#scrim")?.remove();
}
function confirmSheet(msg, fn) {
  sheet(`<h3>${esc(msg)}</h3><div class="row" style="margin-top:16px"><button class="btn ghost grow" id="cN">Keep</button><button class="btn danger grow" id="cY">Delete</button></div>`);
  $("#cN").onclick = closeSheet; $("#cY").onclick = async () => { try { await fn(); toast("Deleted"); } catch (e) { toast(e.message); } closeSheet(); };
}

/* ---------------- start ---------------- */
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });
$("#avatarBtn").onclick = () => go("profile");
(async () => {
  try { await DB.init(); } catch (e) { toast("Couldn't load your data: " + e.message); }
  if (LIVE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (LIVE) sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_OUT") { S.user = null; render(); } });
  render();
})();
</script>
