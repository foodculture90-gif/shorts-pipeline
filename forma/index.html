<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>FORMA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FORMA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>window.FORMA_CONFIG = window.FORMA_CONFIG || {};</script>
<script src="config.js" onerror="void 0"></script>
<style>
/* Layout: one phone-width column, sticky header, bottom tab bar; cards only for things you act on */
:root{
  --bg:#efe9df; --bg2:rgba(20,20,20,.06); --card:rgba(255,255,255,.55); --ink:#141414; --ink2:#5d574e; --ink3:#9a9184;
  --line:rgba(20,20,20,.08); --accent:#141414; --accent2:#8c8478; --accentSoft:rgba(20,20,20,.07);
  --green:#1f7a4d; --greenSoft:rgba(31,122,77,.1); --red:#b23a3a; --redSoft:rgba(178,58,58,.1); --blue:#8c8478; --blueSoft:rgba(140,132,120,.15);
  --amber:#c2a878; --amberSoft:rgba(194,168,120,.18);
  --glass:rgba(255,255,255,.5); --glassLine:rgba(255,255,255,.8);
  --shadow:0 10px 30px rgba(70,52,28,.08),inset 0 1px 0 rgba(255,255,255,.7);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Sora","IBM Plex Sans",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:22px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body{background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.06em}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff}
.avatar{width:34px;height:34px;border-radius:99px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:800;border:none}
h1{font-size:27px;letter-spacing:-.03em;margin:6px 0 2px;font-weight:800;text-wrap:balance}
h2{font-size:16px;margin:24px 2px 10px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--ink2);font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.btn{border:none;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--bg2);color:var(--ink)}
.btn.small{padding:8px 12px;border-radius:11px;font-size:13.5px}
.btn.danger{background:var(--redSoft);color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:none;color:var(--accent);font-weight:700;padding:0;font-size:13.5px}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:15px;color:var(--ink)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.pill.green{background:var(--greenSoft);color:var(--green)}.pill.orange{background:var(--accentSoft);color:var(--accent)}
.pill.blue{background:var(--blueSoft);color:var(--blue)}.pill.amber{background:var(--amberSoft);color:var(--amber)}
.demo{display:flex;gap:10px;align-items:center;background:var(--amberSoft);color:var(--amber);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:4px}
/* today ring */
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media(max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.macro{display:grid;gap:4px}
.macro .lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink2)}
.bar{height:7px;border-radius:9px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile .n{font-size:22px;font-weight:800;letter-spacing:-.02em}
.tile .l{font-size:12px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 8px;display:grid;justify-items:center;gap:6px;font-weight:700;font-size:12.5px;box-shadow:var(--shadow)}
.quick svg{color:var(--accent)}
.coach{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.coach .sub{color:#fff;opacity:.9}
.coach .btn{background:rgba(255,255,255,.22)}
/* lists */
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li img,.li .ph{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg2);display:grid;place-items:center;color:var(--ink3)}
.li .t{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.li .d{font-size:12.5px;color:var(--ink2)}
.kcal{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-size:10px;font-family:var(--mono)}
.empty{color:var(--ink2);font-size:13.5px;text-align:center;padding:18px 8px}
.list-plain{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.steps{counter-reset:s;display:grid;gap:10px;margin:8px 0 0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:99px;background:var(--accentSoft);color:var(--accent);font-weight:800;font-size:12px;display:grid;place-items:center}
code,.code{font-family:var(--mono);font-size:12.5px;background:var(--bg2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:none;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--ink3)}
nav.tabs button.on{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.photo-prev{width:100%;max-height:260px;object-fit:cover;border-radius:16px;display:block}
.item-edit{display:grid;grid-template-columns:1fr 64px 56px 56px 56px 28px;gap:6px;align-items:center}
.item-edit input{padding:8px 6px;font-size:13.5px;text-align:center;min-width:0}
.item-edit input:first-child{text-align:left}
.item-edit .h{font-size:10.5px;font-weight:700;color:var(--ink3);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.item-edit .h:first-child{text-align:left}
.x{border:none;background:none;color:var(--ink3);font-size:18px;padding:0}
.spinner{width:22px;height:22px;border:3px solid var(--accentSoft);border-top-color:var(--accent);border-radius:99px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.bf{font-size:34px;font-weight:800;letter-spacing:-.03em}
.auth{max-width:420px;margin:8vh auto 0;display:grid;gap:14px}
/* v2: plans, barcode, streaks, reminders */
.quick{grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{padding:12px 4px;font-size:11.5px;line-height:1.2;text-align:center}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--accent);background:var(--accentSoft);border-radius:99px;padding:6px 11px 6px 8px;border:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week .d{display:grid;justify-items:center;gap:2px;padding:7px 0;border-radius:12px;background:var(--bg2);font-size:11.5px;font-weight:800;color:var(--ink3);min-height:46px}
.week .d.train{background:var(--accentSoft);color:var(--accent)}
.week .d.done{background:var(--accent);color:#fff}
.week .d.today{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.ex{border-bottom:1px solid var(--line);padding:12px 0}
.ex:last-child{border-bottom:none}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.set{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:13px;color:var(--ink2)}
.set.on{background:var(--green);border-color:var(--green);color:#fff}
input.in.kg{width:78px;padding:9px 6px;text-align:center;margin-left:auto}
.restbar{position:sticky;top:-18px;z-index:2;margin:-18px -16px 12px;padding:11px 16px;background:var(--green);color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-radius:22px 22px 0 0}
.restbar button{background:rgba(255,255,255,.22);border:none;color:#fff;font-weight:700;border-radius:10px;padding:6px 12px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;display:grid;justify-items:center;align-content:start;gap:5px}
.badge .medal{width:44px;height:44px;border-radius:99px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.badge.locked .medal{background:var(--bg2);color:var(--ink3)}
.badge.locked .bt{color:var(--ink2)}
.badge .bt{font-weight:800;font-size:12.5px;line-height:1.2}
.badge .bd{font-size:11px;color:var(--ink2);line-height:1.25}
.scanbox{width:100%;min-height:240px;border-radius:16px;overflow:hidden;background:#111;position:relative}
.scanbox video{width:100%!important;display:block;border-radius:16px}
input[type=time].in{width:124px;flex:none;padding:8px 6px;font-size:14px}
.rem{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.rem input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
/* v4: cream + black, frosted glass */
h1,h2,h3,.bf,.big,.n,.kbig,.sn,.brand,.kcal,.tile .n,.ct{font-family:var(--disp)}
h1{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:10px 0 4px}
h2{font-size:17px;font-weight:600;margin:28px 2px 12px;letter-spacing:-.01em}
body{background:var(--bg);min-height:100vh}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 30% at 85% 8%,rgba(214,196,168,.55),transparent 70%),
             radial-gradient(45% 35% at 5% 45%,rgba(255,255,255,.9),transparent 70%),
             radial-gradient(40% 30% at 90% 85%,rgba(196,182,160,.45),transparent 70%)}
.eyebrow{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;color:var(--ink2)}
.card,.tile,.quick button,.badge,.coach{background:var(--glass);border:1px solid var(--glassLine);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
.card{padding:18px;border-radius:22px}
.tile{border-radius:18px}
.tile .l{font-weight:500}
.btn{background:var(--ink);color:var(--bg);border-radius:14px;font-weight:600}
.btn.ghost{background:rgba(255,255,255,.55);color:var(--ink);border:1px solid var(--glassLine)}
.btn.danger{background:rgba(180,40,40,.08);color:#a12a2a}
.mark{background:var(--ink);color:var(--bg);border-radius:9px}
.brand{letter-spacing:.14em;font-weight:600}
.avatar{background:rgba(255,255,255,.6);color:var(--ink);border:1px solid var(--glassLine)}
header.top{background:rgba(239,233,223,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
body::before{background:rgba(239,233,223,.9)}
nav.tabs{background:rgba(250,247,241,.72);border-top:1px solid var(--glassLine);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
nav.tabs button{font-weight:600;color:var(--ink3)}
nav.tabs button.on{color:var(--ink)}
.quick button{font-weight:600;color:var(--ink)}
.quick svg{color:var(--ink)}
.coach{color:var(--ink)}
.coach .sub{color:var(--ink2);opacity:1}
.coach .btn{background:var(--ink);color:var(--bg)}
.demo{background:rgba(255,255,255,.55);color:var(--ink2);border:1px solid var(--glassLine)}
.streak{background:var(--ink);color:var(--bg)}
.pill{background:rgba(255,255,255,.6);color:var(--ink2)}
.pill.green{background:rgba(31,122,77,.1);color:#1f7a4d}.pill.amber{background:rgba(150,110,30,.1);color:#8a6418}
.pill.orange,.pill.blue{background:rgba(17,17,17,.07);color:var(--ink)}
.seg{background:rgba(17,17,17,.06)}
.seg button.on{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
input.in,select.in,textarea.in{background:rgba(255,255,255,.6);border-color:var(--glassLine)}
.sheet{background:rgba(250,247,241,.88);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border-top:1px solid var(--glassLine)}
.scrim{background:rgba(20,18,14,.35)}
.toast{background:var(--ink);color:var(--bg)}
.badge .medal{background:var(--ink);color:var(--bg)}
.badge.locked .medal{background:rgba(17,17,17,.06);color:var(--ink3)}
.set.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.restbar{background:var(--ink);color:var(--bg)}
.steps li::before{background:var(--ink);color:var(--bg)}
code,.code{background:rgba(17,17,17,.06)}
.li img,.li .ph{background:rgba(17,17,17,.05)}
.ring .big{font-size:34px}
.hero{gap:20px}
/* training days */
.train-card .ct{font-size:16px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.55);border:1px solid var(--glassLine);border-radius:16px;padding:12px}
.sn{font-size:28px;font-weight:600;color:var(--ink);line-height:1;letter-spacing:-.02em}
.sn span{font-size:14px;color:var(--ink3);font-weight:500;margin-left:2px}
.sl{font-size:12px;color:var(--ink2);margin-top:6px}
.wdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--ink3);font-weight:600}
.wd i{width:100%;max-width:34px;height:8px;border-radius:99px;background:rgba(17,17,17,.08)}
.wd.on i{background:var(--ink)}
.wd.now span{color:var(--ink)}
.wd.later i{opacity:.45}
.yscroll{overflow-x:auto;margin-top:10px;padding-bottom:6px;scrollbar-width:none}
.yscroll::-webkit-scrollbar{display:none}
.ymonths{display:grid;gap:0;font-size:10.5px;color:var(--ink3);margin-bottom:4px;white-space:nowrap}
.ygrid{display:flex;gap:3px}
.ycol{display:grid;grid-template-rows:repeat(7,11px);gap:3px}
.ycol i,.ylegend i{width:11px;height:11px;border-radius:3px;background:rgba(17,17,17,.07);display:block}
.ycol i.off{background:transparent}
.l1{background:rgba(17,17,17,.3)!important}.l2{background:rgba(17,17,17,.6)!important}.l3{background:var(--ink)!important}
.ylegend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--ink3);margin-top:6px}
.ylegend span{margin:0 4px}
/* avatar */
.avcard{display:grid;gap:16px}
.avwrap{max-width:250px;width:100%;margin:0 auto;position:relative}
.avwrap.photo{max-width:270px;isolation:isolate}
.avwrap.photo .avphoto{opacity:0;transition:opacity .6s;position:relative;z-index:1}
.avwrap.photo.ok .avphoto{opacity:1}
.avwrap.photo .avfallback{position:absolute;inset:0;z-index:2;transition:opacity .4s}
.avwrap.photo.ok .avfallback{opacity:0;pointer-events:none}
.avwrap.photo .avfallback .er{display:none}
.avwrap.photo.bad .avfallback .er{display:inline}
.avwrap.photo.bad .avfallback .ld{display:none}
.avfire{position:absolute;left:-14%;right:-14%;bottom:-4%;height:85%;z-index:0;pointer-events:none}
.avfire svg{width:100%;height:100%;display:block}
.spark{animation:rise 2.4s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.seg.avmode{display:flex;gap:6px;justify-content:center;margin:2px auto 0;background:var(--glass);border:1px solid var(--glassLine);border-radius:99px;padding:4px;width:max-content}
.seg.avmode button{border:none;background:none;padding:6px 16px;border-radius:99px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg.avmode button.on{background:var(--ink);color:var(--bg)}
.avphoto{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:28px;display:block;box-shadow:0 14px 34px rgba(60,40,20,.18)}

  kcal = Math.round(kcal / 10) * 10;
  const fat = Math.round(kcal * 0.27 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return {kcal, protein, carbs, fat, tdee: Math.round(tdee), steps: 8000};
}

      return {name: payload.context?.text || "Snack", meal: guessMeal(), items: [{name: payload.context?.text || "Snack", grams: 150, kcal: 250, p: 8, c: 30, f: 10}]}; }
    if (type === "calories") { const b = targets({...S.profile, kcal_mode: "auto"}); return {kcal: b.kcal, protein: b.protein, why: "Demo: about 450 kcal under what you burn, for steady fat loss of roughly 0.4 kg a week while keeping muscle."}; }

    if (type === "physique") return {bf_low: 17, bf_high: 20, summary: "Demo result: steady progress since your last check, with a leaner waist and more visible shoulders.",
      strengths: ["Shoulders and arms", "Posture looks upright"], focus: ["Upper chest", "Lower abs and obliques"], plan: ["Stay near your calorie target 5-6 days a week", "Progressive overload on presses", "Keep 8k+ steps a day"]};
    return {tip: "You're 34 g short on protein today. A shake or 200 g of skyr closes the gap before dinner.", demo: true};
  }
  const {data} = await sb.auth.getSession();
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/ai", {method: "POST",
    headers: {"Content-Type": "application/json", Authorization: "Bearer " + data.session.access_token, apikey: CFG.SUPABASE_ANON_KEY},
    body: JSON.stringify({type, ...payload})});
  const j = await r.json().catch(() => ({}));

}

function shrink(file, max = 1024, q = 0.82) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => {
    const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    res(c.toDataURL("image/jpeg", q)); URL.revokeObjectURL(img.src); }; img.onerror = () => rej(new Error("Couldn't read that photo")); img.src = URL.createObjectURL(file); });
}

/* ---------------- charts ---------------- */
function lineChart(pts, {w = 520, h = 150, unit = ""} = {}) {
  if (pts.length < 2) return '<div class="empty">Log at least two days to see your trend.</div>';
  const ys = pts.map(p => p.y), lo = Math.min(...ys), hi = Math.max(...ys), pad = Math.max(0.5, (hi - lo) * 0.15);
  const y0 = lo - pad, y1 = hi + pad, L = 34, R = 10, T = 10, B = 22;
  const xs = pts.map(p => p.x), x0 = Math.min(...xs), x1 = Math.max(...xs) || 1;
  const X = x => L + (x - x0) / ((x1 - x0) || 1) * (w - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (h - T - B);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const area = d + ` L${X(pts.at(-1).x).toFixed(1)} ${h - B} L${X(pts[0].x).toFixed(1)} ${h - B} Z`;
  const grid = [y0 + pad, (y0 + y1) / 2, y1 - pad].map(v => `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${r1(v)}</text>`).join("");
  const last = pts.at(-1);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend chart">${grid}
    <path d="${area}" fill="var(--accentSoft)" opacity=".7"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
    <text x="${L}" y="${h - 6}">${esc(pts[0].label || "")}</text><text x="${w - R}" y="${h - 6}" text-anchor="end">${esc(last.label || "")}</text></svg>`;
}
function barChart(vals, labels, goal, {w = 520, h = 150} = {}) {
  const mx = Math.max(goal || 0, ...vals, 1) * 1.1, L = 8, R = 8, T = 10, B = 22, bw = (w - L - R) / vals.length;
  const Y = v => T + (1 - v / mx) * (h - T - B);
  const bars = vals.map((v, i) => `<rect x="${(L + i * bw + bw * 0.18).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${(h - B - Y(v)).toFixed(1)}" rx="5"
     fill="${v >= goal ? "var(--accent)" : "var(--accent2)"}" opacity="${v >= goal ? 1 : .55}"/><text x="${(L + i * bw + bw / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle">${esc(labels[i])}</text>`).join("");
  const g = goal ? `<line x1="${L}" x2="${w - R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ink3)" stroke-dasharray="4 4"/><text x="${w - R}" y="${Y(goal) - 4}" text-anchor="end">goal ${goal.toLocaleString()}</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Steps per day">${bars}${g}</svg>`;
}
function stepRing(n, goal) {
  const R = 56, C = 2 * Math.PI * R, p = Math.min(1, n / (goal || 1));
  return `<svg width="124" height="124" viewBox="0 0 132 132" aria-hidden="true" style="flex:none"><circle cx="66" cy="66" r="${R}" fill="none" stroke="#26262a" stroke-width="14"/>
    ${p > 0 ? `<circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 66 66)"/>` : ""}</svg>`;
}
function ring(eaten, target) {
  const R = 64, C = 2 * Math.PI * R, p = Math.min(1, eaten / (target || 1)), over = eaten > target;
  return `<div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--bg2)" stroke-width="13"/>
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="${over ? "var(--red)" : "var(--accent)"}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}"/></svg>
    <div class="mid"><span class="big num">${r0(Math.abs(target - eaten)).toLocaleString()}</span><span class="sub">${over ? "kcal over" : "kcal left"}</span></div></div>`;
}

/* ---------------- training days (from Apple Health / Fitness + manual) ---------------- */
const WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const wdOf = (s = dayStr()) => (new Date(s + "T12:00:00").getDay() + 6) % 7;
const allWorkouts = () => {
  const w = of("workout").map(e => ({day: e.day, minutes: +e.data.minutes || 0}));
  of("health").forEach(h => (h.data.workouts || []).forEach(x => w.push({day: h.day, minutes: +x.minutes || 0})));
  return w;
};
// minutes trained per day: logged workouts, or Apple exercise minutes (30+ counts as a training day)
function trainingMap() {
  const m = new Map();
  allWorkouts().forEach(w => m.set(w.day, (m.get(w.day) || 0) + Math.max(w.minutes, 1)));
  of("health").forEach(h => { const ex = +h.data.exercise_min || 0; if (ex >= 30 && ex > (m.get(h.day) || 0)) m.set(h.day, ex); });
  return m;
}
function trainingTotals() {
  const m = trainingMap(), t = dayStr(), mon = addDays(t, -wdOf(t)), month = t.slice(0, 7), year = t.slice(0, 4);
  let week = 0, mo = 0, yr = 0;
  for (const d of m.keys()) { if (d > t) continue; if (d >= mon) week++; if (d.startsWith(month)) mo++; if (d.startsWith(year)) yr++; }
  const dayOfYear = Math.round((new Date(t + "T12:00:00") - new Date(year + "-01-01T12:00:00")) / 864e5) + 1;
  return {m, week, month: mo, year: yr, dayOfMonth: +t.slice(8, 10), dayOfYear, mon};
}
function weekDots(m, mon) {
  const t = dayStr();
  return `<div class="wdots">${WD.map((d, i) => { const day = addDays(mon, i), on = m.has(day);
    return `<div class="wd ${on ? "on" : ""} ${day === t ? "now" : ""} ${day > t ? "later" : ""}"><i></i><span>${d.slice(0, 1)}</span></div>`; }).join("")}</div>`;
}
function yearGrid(m) {
  const t = dayStr(), year = t.slice(0, 4), start = addDays(year + "-01-01", -wdOf(year + "-01-01"));
  const weeks = Math.ceil((Math.round((new Date(t + "T12:00:00") - new Date(start + "T12:00:00")) / 864e5) + 1) / 7);
  let cols = "", months = "", lastMonth = "";
  for (let w = 0; w < weeks; w++) {
    const first = addDays(start, w * 7), mo = first.slice(5, 7);
    months += `<span>${mo !== lastMonth && first.slice(0, 4) === year ? new Date(first + "T12:00:00").toLocaleDateString(undefined, {month: "short"}) : ""}</span>`;
    lastMonth = mo;
    cols += `<div class="ycol">${[...Array(7)].map((_, i) => { const d = addDays(first, i);
      if (!d.startsWith(year) || d > t) return `<i class="off"></i>`;
      const min = m.get(d) || 0, lv = !min ? 0 : min < 30 ? 1 : min < 60 ? 2 : 3;
      return `<i class="l${lv}" title="${niceDay(d)}${min ? ": " + min + " min" : ""}"></i>`; }).join("")}</div>`;
  }
  return `<div class="yscroll" id="yscroll"><div class="ymonths" style="grid-template-columns:repeat(${weeks},14px)">${months}</div><div class="ygrid">${cols}</div></div>`;
}
/* every workout (logged + Apple Health), grouped by month; this month open, older months fold away */
function workoutList() {
  const wk = [];
  of("health").forEach(h => (h.data.workouts || []).forEach(w => wk.push({...w, day: h.day, src: "watch"})));
  of("workout").forEach(w => wk.push({...w.data, day: w.day, id: w.id, src: "manual"}));

  const groups = new Map(); wk.forEach(w => { const k = w.day.slice(0, 7); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(w); });
  const cur = dayStr().slice(0, 7), hm = m => m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? " " + (m % 60) + "m" : ""}` : `${m} min`;

  sheet(`<h3>Scan a barcode</h3><div class="sub">Point your camera at the barcode on the pack.</div>

/* ---------------- streaks & badges ---------------- */
const mealDays = () => new Set(of("meal").map(e => e.day));
function streak() { if (!S.profile) return 0; const m = mealDays(); let d = dayStr(); if (!m.has(d)) d = addDays(d, -1); let n = 0; while (m.has(d)) { n++; d = addDays(d, -1); } return n; }
/* a streak breaks the moment a whole day passes with nothing logged; returns the length of a streak that broke yesterday */
function lostStreak() { if (!S.profile) return 0; const m = mealDays(), t = dayStr(), y = addDays(t, -1); if (m.has(t) || m.has(y)) return 0;
  let n = 0, d = addDays(y, -1); while (m.has(d)) { n++; d = addDays(d, -1); } return n >= 2 ? n : 0; }
function bestStreak() { let best = 0, cur = 0, prev = null; for (const d of [...mealDays()].sort()) { cur = prev && addDays(prev, 1) === d ? cur + 1 : 1; best = Math.max(best, cur); prev = d; } return best; }
const BADGES = [
  ["first_meal", "First bite", "Log your first meal", c => [c.meals, 1]],
  ["streak3", "On a roll", "3-day logging streak", c => [c.best, 3]],
  ["streak7", "Week strong", "7-day logging streak", c => [c.best, 7]],
  ["streak30", "Habit locked", "30-day logging streak", c => [c.best, 30]],
  ["meals50", "Half century", "Log 50 meals", c => [c.meals, 50]],
  ["protein5", "Protein pro", "Hit protein 5 of the last 7 days", c => [c.protein, 5]],
  ["workout1", "First rep", "Finish a workout", c => [c.workouts, 1]],
  ["workouts10", "Ten down", "Finish 10 workouts", c => [c.workouts, 10]],
  ["week4", "Four-day week", "Train 4 days in one week", c => [c.week4, 1]],
  ["steps10k", "10k club", "10,000 steps in a day", c => [c.steps10k, 1]],
  ["scan1", "Baseline", "First physique check-in", c => [c.scans, 1]],
  ["weigh10", "Steady scale", "10 weigh-ins", c => [c.weighs, 10]],
];
function badges() {
  const t = dayStr(), tg = targets(S.profile), w = allWorkouts(), tm = trainingMap();
  let week4 = 0, protein = 0;
  for (let k = 0; k < 52 && !week4; k++) { const mon = addDays(t, -wdOf(t) - 7 * k), sun = addDays(mon, 6);
    if ([...tm.keys()].filter(d => d >= mon && d <= sun).length >= 4) week4 = 1; }
  for (let i = 0; i < 7; i++) if (dayTotals(addDays(t, -i)).p >= tg.protein * 0.95) protein++;
  const c = {meals: of("meal").length, best: bestStreak(), workouts: w.length, week4, protein, scans: of("scan").length, weighs: of("weight").length,
    steps10k: of("health").some(h => (+h.data.steps || 0) >= 10000) ? 1 : 0};
  return BADGES.map(([id, name, desc, f]) => { const [v, goal] = f(c); return {id, name, desc, v: Math.min(v, goal), goal, got: v >= goal}; });
}
function checkBadges() {
  if (!S.profile) return;
  const key = "forma.badges." + (S.user?.id || "demo"), prev = ls.get(key, null), seen = new Set(prev || []);
  const got = badges().filter(b => b.got), fresh = got.filter(b => !seen.has(b.id));
  got.forEach(b => seen.add(b.id)); ls.set(key, [...seen]);
  if (prev && fresh.length) toast("Badge unlocked: " + fresh.map(b => b.name).join(", "));
}
function badgesSection() {
  const list = badges(), n = list.filter(b => b.got).length, stk = streak(), best = bestStreak();

    <div class="badges">${list.map(b => `<div class="badge ${b.got ? "" : "locked"}"><div class="medal">${b.got ? ICON.medal : `<span class="num" style="font-size:12px;font-weight:800">${b.v}/${b.goal}</span>`}</div>

const canPush = () => LIVE && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

      <radialGradient id="gled"><stop offset="0" stop-color="#d4ff3a" stop-opacity=".35"/><stop offset="1" stop-color="#d4ff3a" stop-opacity="0"/></radialGradient></defs>`;
    const tyre = (x, y) => `<circle cx="${x}" cy="${y}" r="6.5" fill="#1a1a1c"/><circle cx="${x}" cy="${y}" r="3" fill="#4a4a4f"/>`;

        : i === 0 ? `<rect x="${x}" y="${iy}" width="${w}" height="13" rx="1.5" fill="#b8352a"/><path d="M${x + 3} ${iy + 4.5}H${x + w - 3}M${x + 3} ${iy + 8.5}H${x + w - 3}" stroke="#7a1f18" stroke-width="1"/>`
        : `<rect x="${x}" y="${iy}" width="${w}" height="13" rx="1.5" fill="${T === 2 ? "#3a3d43" : "#8d8a83"}"/><path d="M${x + w / 2} ${iy + 2}V${iy + 11}" stroke="${T === 2 ? "#24262a" : "#6f6c66"}" stroke-width="1"/>`;
      const ev = T > 1 ? `<rect x="${bx(i) + bw / 2 - 5}" y="${iy + 15}" width="10" height="9" rx="2" fill="#f4f4f0"/><circle cx="${bx(i) + bw / 2}" cy="${iy + 19.5}" r="1.8" fill="#4fd65a"/>` : "";
      return cab + ev; }).join("");
    // side wall: tyre rack / workbench
    const side = T === 1 ? `<rect x="${gx + gw - 26}" y="${iy + 128}" width="15" height="24" rx="1" fill="#8a6a48"/>${tyre(x0 + 9, iy + 130)}${tyre(x0 + 9, iy + 145)}`
      : `<rect x="${x0}" y="${iy + 18}" width="17" height="${ih - 30}" fill="${T === 3 ? "#1a1a1d" : "#3a3d43"}"/>${Array.from({length: 8}, (_, k) => tyre(x0 + 8.5, iy + 30 + k * 15)).join("")}`;
    const lines = Array.from({length: bays + 1}, (_, i) => `<path d="M${bx(i)} ${iy + 30}V${iy + ih - 6}" stroke="${line}" stroke-width="${T === 3 ? 2 : 2.5}" opacity="${T === 1 ? .7 : .9}"/>`).join("")
      + (T === 3 ? Array.from({length: bays + 1}, (_, i) => `<ellipse cx="${bx(i)}" cy="${iy + 92}" rx="7" ry="64" fill="url(#gled)"/>`).join("") : "");
    const stops = Array.from({length: bays}, (_, i) => `<rect x="${bx(i) + bw / 2 - 16}" y="${iy + 30}" width="32" height="4" rx="2" fill="${T === 3 ? "#2a2a2e" : "#f2c94c"}"/>`).join("");
    const glowL = T > 1 ? Array.from({length: bays}, (_, i) => `<ellipse cx="${bx(i) + bw / 2}" cy="${cy}" rx="${bw * .55}" ry="70" fill="url(#gspot)"/>`).join("") : "";
    const lift = T === 3 ? (() => { const x = bx(bays - 1); return `<g>${[x + 5, x + bw - 11].map(px => `<rect x="${px}" y="${cy - 10}" width="6" height="20" rx="1" fill="#2c2c30"/><rect x="${px}" y="${cy - 10}" width="6" height="3" fill="#d4ff3a"/>`).join("")}
      <path d="M${x + 11} ${cy - 30}H${x + bw - 11}M${x + 11} ${cy + 30}H${x + bw - 11}" stroke="#3a3a3f" stroke-width="3"/></g>`; })() : "";
    const doors = Array.from({length: bays}, (_, i) => `<rect x="${bx(i) + 6}" y="${gy + gh - 10}" width="${bw - 12}" height="21" fill="${fill}"/><rect x="${bx(i) + 6}" y="${gy + gh - 12}" width="${bw - 12}" height="4" fill="${T === 3 ? "#0e0e10" : "#6c6a64"}"/><path d="M${bx(i) + 6} ${gy + gh - 11}H${bx(i) + bw - 6}" stroke="#fff" stroke-width=".6" opacity=".35"/>`).join("");
    const lamps = [gx - 3, gx + gw + 3].map(x => `<circle cx="${x}" cy="${gy + gh + 13}" r="16" fill="url(#hglow)"/><circle cx="${x}" cy="${gy + gh + 6}" r="2.6" fill="#fff3c4"/>`).join("");
    const plant = T === 3 ? [gx - 18, gx + gw + 18].map(x => `<rect x="${x - 9}" y="${gy + 20}" width="18" height="18" rx="2" fill="#2a2a2e"/>${tree(x, gy + 29, 8)}`).join("") : "";
    const apron = `<path d="M${ix - 4} ${gy + gh + 11}H${ix + bays * bw + 4}L${ix + bays * bw + 14} 214H${ix - 14}Z" fill="${T === 3 ? "#2a2a2e" : on("paving") ? "url(#hconc)" : "#a29c8c"}" opacity="${T === 3 ? 1 : .9}"/>`;
    return `${defs}<g transform="translate(0 ${H}) scale(${gS})"><rect x="0" y="0" width="${W2}" height="214" fill="${on("paving") || T > 1 ? "url(#hconc)" : "url(#hgravel)"}"/>${apron}
      <rect x="${gx + 6}" y="${gy + 6}" width="${gw + 4}" height="${gh + 6}" fill="#000" opacity=".28" filter="url(#hshB)"/>

      <rect x="${gx + 9}" y="${iy}" width="${gw - 18}" height="9" fill="url(#hinT)"/><rect x="${gx + 9}" y="${iy}" width="9" height="${ih}" fill="url(#hinL)"/>
      ${glowL}${lines}${stops}${lift}${side}<g filter="url(#sh)">${back}</g>${doors}${lamps}${plant}
      ${parked.slice(nd, nd + bays).map((id, i) => car(id, bx(i) + bw / 2, cy, "g" + i)).join("")}</g>`;
  })();
  const [dx, dy, dw, dh] = L.drive, [px, py, pw, ph] = L.pool, [ux, uy] = L.loung, E = L.extra;
  const waves = Array.from({length: Math.max(2, Math.floor(ph / 26))}, (_, i) => `<path d="M${px + 12 + (i % 2) * 14} ${py + 18 + i * 24} q8 -5 16 0 t16 0${pw > 100 ? " t16 0" : ""}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H + GH}" class="gymsvg" role="img" aria-label="Your house, seen from above">
  <defs>${MDEFS}
    <pattern id="hgrass" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="${on("garden") ? "#4a7a3a" : "#7a7652"}"/><path d="M1 7 L2 4 M5 8 L6 5 M3 3 L4 0" stroke="${on("garden") ? "#3d6930" : "#6a6646"}" stroke-width="1"/><path d="M6 2 L7 0" stroke="${on("garden") ? "#5a8c47" : "#8a8660"}" stroke-width="1"/></pattern>
    <pattern id="hwood" width="96" height="12" patternUnits="userSpaceOnUse"><rect width="96" height="12" fill="#b88a5a"/><rect width="96" height="6" fill="#c2956a"/><path d="M0 6 H96 M0 12 H96 M30 0 V6 M74 6 V12" stroke="#8e6a43" stroke-width=".8"/></pattern>
    <pattern id="hrubber" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#2c2d31"/><path d="M0 0 H16 M0 0 V16" stroke="#232428" stroke-width="1.2"/></pattern>
    <pattern id="hbare" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#9a978f"/><circle cx="14" cy="20" r="9" fill="#a6a39b" opacity=".6"/><circle cx="44" cy="46" r="1" fill="#85827b"/><path d="M0 60 H60 V0" stroke="#8a877f" stroke-width="1" fill="none"/></pattern>
    <pattern id="htile" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#e9e6df"/><path d="M0 0 H14 M0 0 V14" stroke="#cfcac0" stroke-width="1"/></pattern>
    <pattern id="hmarble" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#f3f0ea"/><path d="M0 0 H70 V70" stroke="#dcd6cc" stroke-width="1" fill="none"/><path d="M6 18 q18 6 30 24 M42 4 q8 18 24 26" stroke="#d2cabd" stroke-width="1" fill="none"/></pattern>
    <pattern id="hdeck" width="10" height="40" patternUnits="userSpaceOnUse"><rect width="10" height="40" fill="#9c7650"/><path d="M0 0 V40" stroke="#7d5c3c" stroke-width="1"/></pattern>
    <pattern id="hconc" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#a8a69f"/><circle cx="9" cy="13" r=".8" fill="#96948d"/><circle cx="28" cy="31" r=".8" fill="#96948d"/><path d="M0 40 H40" stroke="#8f8d86" stroke-width="1"/></pattern>
    <pattern id="hgravel" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#8f897b"/><circle cx="2" cy="3" r="1" fill="#a39d8e"/><circle cx="7" cy="6" r="1.1" fill="#7a7466"/><circle cx="4" cy="8.5" r=".8" fill="#b0aa9b"/></pattern>
    <linearGradient id="hwater" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd0e8"/><stop offset="1" stop-color="#1f8fb8"/></linearGradient>
    <linearGradient id="hglass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4552"/><stop offset="1" stop-color="#11161c"/></linearGradient>
    <linearGradient id="hsofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6470"/><stop offset="1" stop-color="#434b55"/></linearGradient>
    <radialGradient id="htree" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#6fa356"/><stop offset=".7" stop-color="#3f7432"/><stop offset="1" stop-color="#2c5523"/></radialGradient>
    <radialGradient id="hglow"><stop offset="0" stop-color="#fff3c4" stop-opacity=".45"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
    <linearGradient id="hinT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="hinL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="hpoolT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b4a66" stop-opacity=".55"/><stop offset="1" stop-color="#0b4a66" stop-opacity="0"/></linearGradient>
    <pattern id="hsand" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#e8d6a8"/><circle cx="3" cy="4" r=".8" fill="#d4bf8a"/><circle cx="9" cy="9" r=".7" fill="#f3e6c4"/></pattern>
    <pattern id="hsnow" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f4f7fa"/><circle cx="4" cy="5" r="1" fill="#dfe7ef"/><circle cx="10" cy="11" r=".8" fill="#e6edf3"/></pattern>
    <pattern id="hroofp" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#4a4a50"/><path d="M0 0 H30 M0 0 V30" stroke="#3c3c42" stroke-width="1.2"/></pattern>
    <pattern id="hsea" width="60" height="30" patternUnits="userSpaceOnUse"><rect width="60" height="30" fill="#2f8fbf"/><path d="M4 12 q8 -5 16 0 t16 0 M30 26 q8 -5 16 0" stroke="#7fd0ee" stroke-width="1.2" fill="none" opacity=".6"/></pattern>
    <pattern id="hstone" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#d8d2c4"/><path d="M0 0 H24 M0 12 H24 M12 0 V12 M0 12 V24" stroke="#bfb7a6" stroke-width="1"/></pattern>
    <filter id="hshB" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  ${groundSVG(L, W, H)}
  <rect x="${dx}" y="${dy}" width="${dw}" height="${dh}" fill="${on("paving") ? "url(#hconc)" : "url(#hgravel)"}"/>
  ${on("paving") ? L.spots.map(([x, y]) => `<rect x="${x - 33}" y="${y - 62}" width="66" height="124" rx="3" fill="none" stroke="#e8e6df" stroke-width="1.5" stroke-dasharray="6 5" opacity=".8"/>`).join("") : ""}
  ${on("fence") && L.hedge ? `<path d="${L.hedge}" stroke="#2f5a26" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#hshB)"/><path d="${L.hedge}" stroke="#4d8040" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="3 6"/>` : ""}
  ${(L.paved || []).map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#hstone)"/>`).join("")}
  ${on("deck") ? `<rect x="${L.deck[0]}" y="${L.deck[1]}" width="${L.deck[2]}" height="${L.deck[3]}" rx="4" fill="url(#hdeck)" filter="url(#sh)"/>` : ""}
  ${on("pool") ? `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="${L.round ? Math.min(pw, ph) / 2 : 10}" fill="url(#hwater)"/><rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="${L.round ? Math.min(pw, ph) / 2 : 10}" fill="none" stroke="#f2f0ea" stroke-width="4"/>
    <rect x="${px + 2}" y="${py + 2}" width="${pw - 4}" height="${Math.min(16, ph / 3)}" rx="8" fill="url(#hpoolT)"/>
    <g fill="none" stroke="#fff" stroke-width="1.2" opacity=".45">${waves}</g>` : ""}
  ${L.shells.map(([x, y, w, h]) => `<rect x="${x + 6}" y="${y + 6}" width="${w + 4}" height="${h + 6}" fill="#000" opacity=".28" filter="url(#hshB)"/><rect x="${x}" y="${y + h - 2}" width="${w}" height="10" fill="${shade(wall, .62)}"/><rect x="${x + w - 2}" y="${y + 4}" width="7" height="${h + 4}" fill="${shade(wall, .76)}"/>`).join("")}
  ${L.shells.map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${wall}"/>`).join("")}
  <rect x="${gx0}" y="${gy0}" width="${gw0}" height="${gh0}" fill="${on("gymfloor") ? "url(#hrubber)" : "url(#hbare)"}"/>
  <rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" fill="${floorFill}"/>
  <rect x="${kx}" y="${ky}" width="${kw}" height="${kh}" fill="${fl === "wood" ? "url(#htile)" : floorFill}"/>
  ${L.pass.map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${floorFill}"/>`).join("")}
  ${[L.gym, L.living, L.kitchen].map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="9" fill="url(#hinT)"/><rect x="${x}" y="${y}" width="9" height="${h}" fill="url(#hinL)"/>`).join("")}
  ${on("mirror") ? `<rect x="${gx0 + 1}" y="${gy0 + 4}" width="4" height="${gh0 - 8}" fill="#cfe7ef"/><rect x="${gx0 + 1}" y="${gy0 + 4}" width="1.5" height="${gh0 - 8}" fill="#fff" opacity=".8"/>` : ""}
  ${on("speakers") ? `<g filter="url(#sh)">${[gy0 + 4, gy0 + gh0 - 19].map(y => `<rect x="${gx0 + gw0 - 14}" y="${y}" width="11" height="15" rx="2" fill="#18181b"/><circle cx="${gx0 + gw0 - 8.5}" cy="${y + 8}" r="3.5" fill="#3a3a3e"/>`).join("")}</g>` : ""}

  ${on("garden") ? L.trees.map(([x, y, r]) => tree(x, y, r)).join("") : ""}
  ${extrasSVG(E, on)}
  ${parked.slice(0, nd).map((id, i) => car(id, L.spots[i][0], L.spots[i][1], "d" + i)).join("")}
  ${garage}
</svg>`;
}

function groundSVG(L, W, H) {
  const g = L.ground;
  if (g === "beach") return `<rect width="${W}" height="${H}" fill="url(#hsand)"/><rect x="0" y="470" width="${W}" height="${H - 470}" fill="url(#hsea)"/><path d="M0 470 Q60 462 120 470 T240 470 T360 470 T480 470" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/>`;
  if (g === "snow") return `<rect width="${W}" height="${H}" fill="url(#hsnow)"/>`;
  if (g === "roof") return `<rect width="${W}" height="${H}" fill="url(#hroofp)"/><rect x="4" y="4" width="${W - 8}" height="${H - 8}" fill="none" stroke="#9fd4ec" stroke-width="3" opacity=".7"/>`;
  if (g === "island") return `<rect width="${W}" height="${H}" fill="url(#hsea)"/><rect x="20" y="20" width="560" height="680" rx="110" fill="url(#hsand)"/><rect x="40" y="40" width="520" height="640" rx="95" fill="url(#hgrass)"/>`;
  return `<rect width="${W}" height="${H}" fill="url(#hgrass)"/>`;
}
function extrasSVG(E, on) {
  const at = (k, f) => E[k] && on(k) ? f(...E[k]) : "";
  return `<g filter="url(#sh)">
  ${at("bbq", (x, y) => `<rect x="${x - 10}" y="${y - 7}" width="20" height="14" rx="3" fill="#2a2a2c"/><path d="M${x - 7} ${y - 3} H${x + 7} M${x - 7} ${y} H${x + 7} M${x - 7} ${y + 3} H${x + 7}" stroke="#777" stroke-width="1"/><circle cx="${x + 3}" cy="${y - 1}" r="2" fill="#e8743a"/>`)}
  ${at("hammock", (x, y) => `<rect x="${x - 3}" y="${y - 6}" width="6" height="6" fill="#6b4a2c"/><rect x="${x + 77}" y="${y - 6}" width="6" height="6" fill="#6b4a2c"/><path d="M${x} ${y - 3} Q${x + 40} ${y + 10} ${x + 80} ${y - 3}" stroke="#e8d3a8" stroke-width="7" fill="none"/>`)}

  if (S.scanner) { const q = S.scanner; S.scanner = null; try { if (q.isScanning) q.stop().then(() => q.clear()).catch(() => {}); } catch {} }
  document.querySelectorAll("#scrim").forEach(sc => { try { sc.remove(); } catch {} });
}
function confirmSheet(msg, fn) {
  sheet(`<h3>${esc(msg)}</h3><div class="row" style="margin-top:16px"><button class="btn ghost grow" id="cN">Keep</button><button class="btn danger grow" id="cY">Delete</button></div>`);
  $("#cN").onclick = closeSheet; $("#cY").onclick = async () => { try { await fn(); toast("Deleted"); } catch (e) { toast(e.message); } closeSheet(); };
}

/* ---------------- start ---------------- */
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });
$("#avatarBtn").onclick = () => go("profile");
(async () => {
  try { await DB.init(); } catch (e) { toast("Couldn't load your data: " + e.message); }
  if (LIVE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (LIVE) sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_OUT") { S.user = null; render(); } });
  render();
})();
</script>
