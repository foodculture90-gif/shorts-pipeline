<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorts Studio</title>
<meta name="theme-color" content="#fff8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shorts Studio">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg:#fff8f5; --bg2:#fbeee8; --card:#ffffff; --ink:#1d1412; --ink2:#6e5d57; --ink3:#a8968f;
  --line:#f2e2da; --accent:#ff2d46; --accent2:#ff7a3d; --accentSoft:#ffe3e6;
  --green:#14935c; --greenSoft:#dbf3e6; --red:#d93636; --redSoft:#fde1e1; --blue:#2d6ce0; --blueSoft:#e2ebfd;
  --amber:#b97800; --amberSoft:#fcf0d2;
  --shadow:0 1px 2px rgba(90,30,20,.05),0 8px 28px rgba(90,30,20,.08);
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130e0d; --bg2:#1d1615; --card:#201918; --ink:#f8efec; --ink2:#c3b2ac; --ink3:#86766f;
  --line:#332926; --accentSoft:#3f1a1f; --greenSoft:#14342a; --redSoft:#3c1e1e; --blueSoft:#1a2741; --amberSoft:#3a2d11;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#130e0d; --bg2:#1d1615; --card:#201918; --ink:#f8efec; --ink2:#c3b2ac; --ink3:#86766f;
  --line:#332926; --accentSoft:#3f1a1f; --greenSoft:#14342a; --redSoft:#3c1e1e; --blueSoft:#1a2741; --amberSoft:#3a2d11;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
body{background:radial-gradient(1100px 480px at 100% -12%,rgba(255,45,70,.12),transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:820px;margin:0 auto;padding:12px 16px calc(100px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 12px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand img{width:32px;height:32px;border-radius:9px}
.sub{color:var(--ink2);font-size:13px}
h1{font-size:27px;letter-spacing:-.03em;margin:2px 0 2px;font-weight:800}
h2{font-size:16px;margin:24px 2px 10px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 a,h2 button{font-size:13px;font-weight:700;text-decoration:none;color:var(--accent);background:none;border:none;cursor:pointer;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:12px}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pipe .card{padding:12px 10px;text-align:center;cursor:pointer}
.pipe .n{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.pipe .l{color:var(--ink2);font-size:11.5px;font-weight:600}
.pipe .card.hot{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.pipe .card.hot .l{color:#fff;opacity:.92}
@media(max-width:380px){.pipe .n{font-size:20px}.pipe .l{font-size:10.5px}}
.reel{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.reel .tile{flex:none;width:132px;scroll-snap-align:start;cursor:pointer;border:none;background:none;padding:0;text-align:left}
.reel .tile .th{width:132px}
.reel .tile b{display:block;font-size:12.5px;line-height:1.25;margin-top:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.th{aspect-ratio:9/16;border-radius:16px;background:var(--bg2);position:relative;overflow:hidden;display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .play{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:99px;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
.th .dur{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.th .spin{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.pill.green{background:var(--greenSoft);color:var(--green)} .pill.red{background:var(--redSoft);color:var(--red)}
.pill.blue{background:var(--blueSoft);color:var(--blue)} .pill.orange{background:var(--accentSoft);color:var(--accent)}
.pill.amber{background:var(--amberSoft);color:var(--amber)}
.feed .item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed .item:last-child{border:none}
.dot{width:8px;height:8px;border-radius:9px;margin-top:6px;flex:none;background:var(--ink3)}
.dot.success{background:var(--green)}.dot.warning{background:var(--amber)}.dot.error{background:var(--red)}
.time{color:var(--ink3);font-size:12px;white-space:nowrap;margin-left:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px;margin:0 -2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ep{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:12px}
.ep .th{width:112px;cursor:pointer;border:none;padding:0}
.ep h3{margin:2px 0 4px;font-size:16px;line-height:1.25;letter-spacing:-.01em}
.ep .info{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ep .lesson{color:var(--ink2);font-size:13.5px}
.cast{display:inline-flex;gap:2px;font-size:15px;margin-right:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 13px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn.block{width:100%;justify-content:center;padding:13px}
.btn[disabled]{opacity:.55;pointer-events:none}
.err{color:var(--red);font-size:13px;margin:4px 0 8px}
.empty{text-align:center;color:var(--ink2);padding:30px 16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.bottom a{flex:1;max-width:120px;min-width:0;text-decoration:none;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:4px 0;position:relative}
nav.bottom a.on{color:var(--accent)}
nav.bottom .badge{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--accent);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.fab{position:fixed;right:max(16px,calc(50% - 394px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:21;background:var(--accent);color:#fff;border:none;border-radius:18px;padding:14px 18px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(255,45,70,.38);cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(20,8,6,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:620px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 4px;font-size:19px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fade{from{opacity:0}}
label.f{display:block;font-weight:700;font-size:13px;margin:16px 0 7px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:80px;resize:vertical}
.hint{color:var(--ink3);font-size:12.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.chip.off{opacity:.32;pointer-events:none}
.chip .ord{font-style:normal;background:var(--accent);color:#fff;border-radius:99px;min-width:18px;height:18px;display:inline-grid;place-items:center;font-size:11px;padding:0 5px}
.picked{background:var(--bg2);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink2);margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpis .card{padding:12px 14px}.kpis .n{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.kpis .l{color:var(--ink2);font-size:12px;font-weight:600;display:flex;gap:5px;align-items:center}
.kpis .d{font-size:12px;font-weight:700;color:var(--green)}
.rank{display:grid;grid-template-columns:22px 64px 1fr;gap:12px;align-items:center;padding:10px 12px}
.rank .no{font-weight:800;color:var(--ink3);text-align:center}
.rank .th{width:64px;border-radius:12px;cursor:pointer;border:none;padding:0}
.rank h3{margin:0 0 5px;font-size:14.5px;line-height:1.25}
.rank .nums{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:6px;border-radius:9px;background:var(--bg2);margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:none}
.row .t{font-weight:700}.row .d{color:var(--ink2);font-size:12.5px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:99px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}.switch input:checked+span:before{transform:translateX(20px)}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);animation:fade .2s;max-width:92vw}
.login{max-width:380px;margin:12vh auto 0;padding:0 18px}
.login .card{padding:24px}
.chart{display:flex;align-items:flex-end;gap:6px;height:96px;padding-top:6px}
.chart div{flex:1;background:var(--accentSoft);border-radius:6px 6px 3px 3px;min-height:3px}
.chart div.v{background:var(--accent)}
.chart-l{display:flex;gap:6px;font-size:10.5px;color:var(--ink3);margin-top:5px}.chart-l span{flex:1;text-align:center}
.sk{background:linear-gradient(90deg,var(--bg2),var(--line),var(--bg2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chan{display:flex;gap:12px;align-items:center}
.chan .av{width:44px;height:44px;border-radius:14px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.split{display:grid;gap:12px}
@media(min-width:700px){.split{grid-template-columns:1fr 1fr}}
.wishnote{background:var(--bg2);border-radius:12px;padding:8px 10px;font-size:12.5px;color:var(--ink2);margin-top:8px}
</style>
</head>
<body>
<div id="root"><div class="app"><header class="top"><div class="brand"><img src="icon.svg" alt="">Shorts Studio</div></header>
  <div class="sk" style="height:34px;width:60%;margin:6px 0 14px"></div><div class="sk" style="height:84px;margin-bottom:12px"></div><div class="sk" style="height:240px"></div></div></div>
<script type="module">
const CFG = window.MC_CONFIG || {};
const DEMO = new URLSearchParams(location.search).has("demo") || !CFG.SUPABASE_URL || CFG.SUPABASE_URL.includes("YOUR-PROJECT");
const sb = DEMO ? null : (await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm")).createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
if ("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------------------------------------------------------------- the 3D world (same names as the render engine)
const CAST = { pip: ["Pip", "🔴"], bubu: ["Bubu", "🐰"], mimi: ["Mimi", "🐱"], gogo: ["Gogo", "🐸"], chiko: ["Chiko", "🐤"],
  lulu: ["Lulu", "🐻"], tobi: ["Tobi", "🦊"], teo: ["Teo", "🐶"], popo: ["Popo", "🐧"], bobo: ["Bobo", "🐼"], zuzu: ["Zuzu", "🦄"],
  leo: ["Leo", "🦁"], dodo: ["Dodo", "🦆"], bolt: ["Bolt", "🤖"], rexy: ["Rexy", "🦖"], trixie: ["Trixie", "🦕"], drako: ["Drako", "🐉"],
  momo: ["Momo", "👾"], ocki: ["Ocki", "🐙"], ellie: ["Ellie", "🐘"], pinky: ["Pinky", "🐷"], hoot: ["Hoot", "🦉"], buzzy: ["Buzzy", "🐝"],
  kiki: ["Kiki", "👧"], nino: ["Nino", "👦"] };
const PLACES = { street: ["Street", "🏡"], park: ["Park", "🌳"], beach: ["Beach", "🏖️"], kitchen: ["Kitchen", "🍳"], playground: ["Playground", "🛝"], snow: ["Snow", "⛄"], bedroom: ["Bedroom", "🧸"], livingroom: ["Living room", "🛋️"], space: ["Moon", "🚀"], pirate: ["Pirate island", "🏴‍☠️"], christmas: ["Christmas", "🎄"],
  farm: ["Farm", "🚜"], camping: ["Camping", "🏕️"], castle: ["Castle", "🏰"], underwater: ["Under the sea", "🐠"], candy: ["Candy Land", "🍭"],
  market: ["Village market", "⛲"], desert: ["Desert", "🌵"], jungle: ["Jungle", "🌴"] };
// the funny stories (plots) + where they can happen (same rules as the planner)
const INDOOR = ["kitchen", "bedroom", "livingroom"], ALLP = Object.keys(PLACES);
const OUTDOOR = ALLP.filter(p => !INDOOR.includes(p) && !["space", "underwater"].includes(p));
const STORIES = {
  steal_treat: ["Treat thief", "🍩", ALLP], ball_bonk: ["Ball bonk", "⚽", [...OUTDOOR, "bedroom", "livingroom", "space"]],
  balloon_float: ["Balloon pop", "🎈", OUTDOOR], gift_surprise: ["Surprise box", "🎁", ALLP],
  hide_seek: ["Hide & seek", "🙈", OUTDOOR.filter(p => !["candy", "desert"].includes(p))], slip_peel: ["Banana slip", "🍌", ALLP],
  sneeze: ["Big sneeze", "🤧", ALLP], dance_party: ["Dance party", "💃", ALLP], bubbles: ["Bubbles", "🫧", ALLP],
  wake_up: ["Wake-up horn", "📯", ALLP], race: ["The race", "🏁", [...OUTDOOR, "space"]],
  magic_trick: ["Magic hat", "🎩", ALLP], seesaw: ["Seesaw launch", "🚀", [...OUTDOOR, "space"]], paint_splat: ["Paint splat", "🎨", ALLP] };
// moral stories: one longer story with a lesson is the whole short (half of the daily shorts are these)
const GARDEN = ["park", "street", "playground", "farm", "camping", "castle", "market", "jungle"];
const MORALS = {
  patience: ["Good things take time", "🌱", GARDEN], sharing: ["Sharing makes us happy", "🍪", ALLP],
  helping: ["Help a friend", "🤝", ALLP], sorry: ["Say sorry", "🌸", ALLP],
  teamwork: ["Together we can", "💪", [...OUTDOOR, "space"]], try_again: ["Never give up", "⭐", ALLP] };
const ALLS = { ...STORIES, ...MORALS };
const IDEAS = ["Who stole the donut?", "Balloon floats away… POP!", "Hide and seek – BOO!", "Banana peel slip", "Surprise gift box", "Ball bonk in the park", "Snow day fun", "Birthday cake mix-up", "Silly day on the moon", "Pirate island party", "Toys in the bedroom", "Christmas presents", "Bubbles under the sea", "Race on the farm", "Dance party at the castle", "Big sneeze in Candy Land"];
const CHANGES = ["Different characters", "Different place", "Funnier moments", "Snow day", "Beach day", "On the moon", "Pirate island", "Sunset colours", "Party hats on", "Start with the banana slip"];

// ---------------------------------------------------------------- icons + helpers
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  play:'<path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/>',
  yt:'<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>',
  tv:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 3l4 3 4-3"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M5 12l5 5L20 7"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>', refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>', spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',

// ---------------------------------------------------------------- data layer (light queries + local cache = fast)
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
const EP_COLS = "id,channel_id,status,title,takeaway,duration,thumb_path,preview_path,youtube_url,views,likes,publish_at,error,created_at,idea,feedback,assets_path,stats_at," +
  "yt:story->yt,summary:story->>summary,hero:story->spec->>hero,friend:story->spec->>friend,place:story->spec->>set,wish:story->spec->wish->>note";
const store = { get(k) { try { return JSON.parse(localStorage.getItem("ss_" + k) || "null"); } catch { return null; } },
                set(k, v) { try { localStorage.setItem("ss_" + k, JSON.stringify(v)); } catch {} } };
const api = {
  async user() { if (DEMO) return { email: "demo@shorts.studio" }; const { data } = await sb.auth.getSession(); return data.session?.user || null; },
  async login(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
  async logout() { if (!DEMO) await sb.auth.signOut(); try { Object.keys(localStorage).filter(k => k.startsWith("ss_")).forEach(k => localStorage.removeItem(k)); } catch {} location.reload(); },
  async channels() { const r = DEMO ? demo.channels : await q(sb.from("channels").select("id,name,niche,per_day,auto_daily,made_for_kids,connected,youtube_title,created_at").order("created_at")); store.set("ch", r); return r; },
  async saveChannel(id, values) {
    if (DEMO) { if (id) Object.assign(demo.channels.find(c => c.id === id), values); else demo.channels.push({ id: "c" + Date.now(), connected: false, ...values }); return; }
    if (id) await q(sb.from("channels").update(values).eq("id", id)); else await q(sb.from("channels").insert(values));
  },
  async deleteChannel(id) { if (DEMO) { demo.channels = demo.channels.filter(c => c.id !== id); return; } await q(sb.from("channels").delete().eq("id", id)); },
  async episodes() {
    if (DEMO) return demo.episodes;
    const [eps, cmds] = await Promise.all([
      q(sb.from("episodes").select(EP_COLS).not("status", "in", "(replaced,deleted)").order("created_at", { ascending: false }).limit(150)),
      q(sb.from("commands").select("id,payload,created_at").eq("type", "generate").in("status", ["queued", "running"]).order("created_at", { ascending: false }).limit(40)),
    ]);
    // shorts you just asked for show up straight away, before a worker picks them up
    const pending = cmds.filter(c => !c.payload?.episode_id).map(c => ({ id: "cmd-" + c.id, channel_id: c.payload?.channel_id, status: "queued",
      idea: c.payload?.idea, feedback: c.payload?.feedback, created_at: c.created_at, pending: true }));
    const all = [...pending, ...eps];
    store.set("eps", all.slice(0, 80));
    return all;
  },
  async commands(rows) { if (DEMO) { rows.forEach(r => demoCommand(r.type, r.payload)); return; } await q(sb.from("commands").insert(rows)); },
  async command(type, payload) { return api.commands([{ type, payload }]); },
  async settings() { if (DEMO) return demo.settings; const r = await q(sb.from("settings").select("*")); return Object.fromEntries(r.map(x => [x.key, x.value])); },
  async setSetting(key, value) { if (DEMO) { demo.settings[key] = value; return; } await q(sb.from("settings").upsert({ key, value })); },
  async activity() { return DEMO ? demo.activity : q(sb.from("activity").select("id,kind,message,created_at").order("created_at", { ascending: false }).limit(12)); },
};
// signed links for thumbnails/previews: one request for many, remembered for 50 minutes
const urlCache = new Map();
async function urls(paths) {
  if (DEMO) return {};
  const need = [...new Set(paths.filter(p => p && !(urlCache.get(p)?.exp > Date.now())))];
  if (need.length) {
    const { data } = await sb.storage.from("media").createSignedUrls(need, 3600);
    (data || []).forEach(d => d.signedUrl && urlCache.set(d.path, { url: d.signedUrl, exp: Date.now() + 50 * 6e4 }));
  }
  return Object.fromEntries(paths.filter(Boolean).map(p => [p, urlCache.get(p)?.url]));
}
function demoCommand(type, p) {
  const e = demo.episodes.find(x => x.id === p.episode_id);
  if (type === "generate") demo.episodes.unshift({ id: "n" + Math.random(), channel_id: p.channel_id, status: "queued", idea: p.idea, created_at: new Date().toISOString() });
  if (type === "publish" && e) { e.status = p.publish_at ? "scheduled" : "publishing"; e.publish_at = p.publish_at; }
  if (type === "delete" && e) demo.episodes = demo.episodes.filter(x => x !== e);
  if (type === "revise" && e) { e.status = "generating"; e.title = null; }
  if (type === "connect_channel") { const c = demo.channels.find(x => x.id === p.channel_id); if (c) c.connected = true; }
}

    <div class="tabs">${Object.keys(labels).map(k => `<button class="tab ${state.tab === k ? "on" : ""}" data-tab2="${k}">${labels[k]}${groups[k].length ? ` · ${groups[k].length}` : ""}</button>`).join("")}</div>
    ${bulk}
    <div class="grid">${list.length ? list.slice(0, 60).map(epCard).join("") : `<div class="card empty"><b>${empty[0]}</b>${empty[1]}</div>`}</div>`);
  root.querySelectorAll("[data-tab2]").forEach(b => b.onclick = () => { state.tab = b.dataset.tab2; viewShorts(); });
  root.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => { state.channel = b.dataset.ch; viewShorts(); });
  root.querySelectorAll("[data-act]").forEach(b => b.onclick = () => episodeAction(b.dataset.act, b.dataset.id, b));
  root.querySelector("#pubAll")?.addEventListener("click", ev => {
    const unconnected = list.filter(e => !state.channels.find(c => c.id === e.channel_id)?.connected).length;
    if (!confirm(`Publish all ${list.length} shorts now?` + (unconnected ? `\n\n${unconnected} belong to a channel that isn't connected yet and will fail.` : ""))) return;
    guard(ev.currentTarget, async () => { await api.commands(list.map(e => ({ type: "publish", payload: { episode_id: e.id } }))); toast(`Publishing ${list.length} shorts`); refresh(); });
  });
  root.querySelector("#schedAll")?.addEventListener("click", () => scheduleAllSheet(list));
  bindCommon();
  fillThumbs(list.slice(0, 60));
}

async function playVideo(id) {
  const e = state.episodes.find(x => x.id === id);
  if (!e) return;
  if (DEMO) { if (e.title) toast("Demo mode: no real video to play"); return; }
  if (!e.preview_path) { if (e.youtube_url) window.open(e.youtube_url, "_blank"); return; }
  const url = (await urls([e.preview_path]))[e.preview_path];
  if (!url) return toast("Preview not available");
  sheet(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px"><h3>${esc(e.title)}</h3><button class="btn ghost" data-close aria-label="Close">${ic("x")}</button></div>
    <video src="${url}" controls autoplay playsinline preload="auto" style="width:100%;max-height:68vh;border-radius:16px;background:#000;aspect-ratio:9/16"></video>
    ${e.wish ? `<div class="wishnote">💡 ${esc(e.wish)}</div>` : ""}
    <div class="hint">Preview quality – YouTube gets the full 1080×1920 version.</div>
    ${e.status === "awaiting_approval" ? `<div class="actions" style="margin-top:12px"><button class="btn primary" data-a="publish">${ic("check", 16)} Publish</button><button class="btn" data-a="schedule">${ic("clock", 16)} Schedule</button><button class="btn" data-a="revise">${ic("edit", 16)} Change</button><button class="btn ghost danger" data-a="delete">${ic("trash", 16)}</button></div>` : ""}`,
    (el, close) => { el.querySelector("[data-close]").onclick = close; el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { close(); episodeAction(b.dataset.a, e.id); }); });
}

function localInput(d) { return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); }
function optimistic(id, values) { const e = state.episodes.find(x => x.id === id); if (e) Object.assign(e, values); route(true); }

async function episodeAction(act, id, btn) {
  const e = state.episodes.find(x => x.id === id);
  if (act === "publish") {
    if (!state.channels.find(c => c.id === e?.channel_id)?.connected) return toast("Connect this channel to YouTube first (Channels)");
    return guard(btn, async () => { await api.command("publish", { episode_id: id }); optimistic(id, { status: "publishing" }); toast("Uploading – live in a few minutes"); refresh(); });
  }
  if (act === "retry") return guard(btn, async () => { await api.commands([{ type: "generate", payload: { channel_id: e.channel_id, idea: e.idea || e.feedback, silent: true } }, { type: "delete", payload: { episode_id: id } }]); toast("Making it again"); refresh(); });
  if (act === "delete") { if (!confirm("Delete this short?")) return; return guard(btn, async () => { await api.command("delete", { episode_id: id }); state.episodes = state.episodes.filter(x => x.id !== id); route(true); toast("Deleted"); refresh(); }); }
  if (act === "schedule") {
    const d = new Date(Date.now() + 864e5); d.setHours(17, 0, 0, 0);
    return sheet(`<h3>Schedule</h3><div class="sub">YouTube makes it public at this time.</div>
      <label class="f">Date & time</label><input type="datetime-local" class="input" id="when" value="${localInput(d)}">
      <div style="margin-top:16px"><button class="btn primary block" id="go">${ic("clock", 16)} Schedule</button></div>`,
      (el, close) => el.querySelector("#go").onclick = ev => guard(ev.currentTarget, async () => {
        const t = new Date(el.querySelector("#when").value);
        if (!(t > new Date(Date.now() + 20 * 6e4))) throw new Error("Pick a time at least 20 minutes from now");
        await api.command("publish", { episode_id: id, publish_at: t.toISOString() }); close(); toast("Scheduled"); refresh();
      }));
  }
  if (act === "revise") {
    return sheet(`<h3>Change this short</h3><div class="sub">Say what to change – everything else stays the same. The new version comes back for your OK.</div>
      <label class="f">What should change?</label><textarea class="input" id="fb" placeholder="e.g. Make it Tobi and Teo at the beach, and start with the balloon"></textarea>
      <div class="chips" style="margin-top:8px">${CHANGES.map(s => `<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <div style="margin-top:16px"><button class="btn primary block" id="go">${ic("refresh", 16)} Remake</button></div>`,
      (el, close) => {
        el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { const t = el.querySelector("#fb"); t.value = (t.value ? t.value.replace(/\.?\s*$/, ". ") : "") + b.dataset.s; });
        el.querySelector("#go").onclick = ev => guard(ev.currentTarget, async () => {
          const fb = el.querySelector("#fb").value.trim(); if (!fb) throw new Error("Write what to change");
          await api.command("revise", { episode_id: id, feedback: fb }); close(); toast("Remaking it"); state.tab = "progress"; refresh();
        });
      });
  }
}

function scheduleAllSheet(list) {
  const start = new Date(); start.setDate(start.getDate() + (start.getHours() >= 16 ? 1 : 0)); start.setHours(start.getHours() >= 16 ? 8 : Math.max(start.getHours() + 1, 8), 0, 0, 0);
  sheet(`<h3>Schedule all ${list.length}</h3><div class="sub">Spreads them out so each one gets its own moment in the Shorts feed.</div>
    <label class="f">First one at</label><input type="datetime-local" class="input" id="st" value="${localInput(start)}">
    <label class="f">Then one every</label><select class="input" id="gap">${[[30, "30 minutes"], [45, "45 minutes"], [60, "1 hour"], [90, "1.5 hours"], [120, "2 hours"]].map(([v, l]) => `<option value="${v}" ${v === 60 ? "selected" : ""}>${l}</option>`).join("")}</select>
    <div class="hint" id="last"></div>
    <div style="margin-top:16px"><button class="btn primary block" id="go">${ic("clock", 16)} Schedule ${list.length} shorts</button></div>`,
    (el, close) => {
      const upd = () => { const t = new Date(el.querySelector("#st").value); const g = +el.querySelector("#gap").value; el.querySelector("#last").textContent = "Last one: " + new Date(+t + g * 6e4 * (list.length - 1)).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" }); };
      el.querySelector("#st").oninput = upd; el.querySelector("#gap").onchange = upd; upd();
      el.querySelector("#go").onclick = ev => guard(ev.currentTarget, async () => {
        const t = new Date(el.querySelector("#st").value), g = +el.querySelector("#gap").value;
        if (!(t > new Date(Date.now() + 20 * 6e4))) throw new Error("Start at least 20 minutes from now");
        await api.commands(list.map((e, i) => ({ type: "publish", payload: { episode_id: e.id, publish_at: new Date(+t + i * g * 6e4).toISOString() } })));
        close(); toast(`Scheduled ${list.length} shorts`); refresh();
      });
    });
}

function newShortSheet(pre = {}) {
  const channels = state.channels;
  if (!channels.length) return toast("Add a channel first (Channels)");
  const story = pre.story ? [pre.story] : [], cast = [], placeSel = { v: pre.place || "" };
  sheet(`<h3>New short</h3><div class="sub">Pick the story, the stars and the place – or leave any of them on “Surprise me”. About 30 seconds, music + sound effects, no words.</div>
    ${channels.length > 1 ? `<label class="f">Channel</label><select class="input" id="ch">${channels.map(c => `<option value="${c.id}" ${c.id === state.channel ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>` : ""}
    <label class="f">What happens? <span class="sub" style="font-weight:500">(tap up to 5, in the order you want them)</span></label>
    <div class="chips" data-chips="story">${Object.entries(STORIES).map(([k, [n, e]]) => `<button type="button" class="chip" data-v="${k}">${e} ${n}</button>`).join("")}</div>
    <label class="f">Or a story with a lesson 💛 <span class="sub" style="font-weight:500">(the whole short)</span></label>
    <div class="chips" data-chips="moral">${Object.entries(MORALS).map(([k, [n, e]]) => `<button type="button" class="chip" data-v="${k}">${e} ${n}</button>`).join("")}</div>
    <label class="f">Who stars? <span class="sub" style="font-weight:500">(up to 2)</span></label>
    ${chips(Object.entries(CAST).map(([k, [n, e]]) => [k, `${e} ${n}`]), "cast")}
    <label class="f">Where?</label>
    ${chips([["", "🎲 Surprise me"], ...Object.entries(PLACES).map(([k, [n, e]]) => [k, `${e} ${n}`])], "place", [placeSel.v])}
    <label class="f">Anything else? <span class="sub" style="font-weight:500">(optional)</span></label>
    <textarea class="input" id="idea" placeholder="e.g. Lulu wears a crown, sunset colours">${esc(pre.idea || "")}</textarea>
    <div class="reel" style="gap:7px;margin-top:8px">${IDEAS.map(t => `<button type="button" class="chip" style="flex:none" data-ex="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <label class="f">How many?</label><div class="seg" id="cnt">${[1, 3, 5, 10].map(n => `<button type="button" data-n="${n}" class="${n === 1 ? "on" : ""}">${n}</button>`).join("")}</div>
    <div class="picked" id="picked"></div>
    <div style="margin-top:14px"><button class="btn primary block" id="go">${ic("spark", 16)} Make it</button></div>
    <div class="hint" style="text-align:center">Ready to approve in about 20–40 minutes.</div>`,
    (el, close) => {
      let n = 1;
      const paint = () => {
        el.querySelectorAll("[data-chips=story] .chip").forEach(b => {
          const k = b.dataset.v, i = story.indexOf(k), [nm, e, where] = STORIES[k];
          b.classList.toggle("on", i >= 0);
          b.classList.toggle("off", i < 0 && !!placeSel.v && !where.includes(placeSel.v));
          b.innerHTML = `${i >= 0 ? `<i class="ord">${i + 1}</i>` : e} ${nm}`;
        });
        el.querySelectorAll("[data-chips=moral] .chip").forEach(b => {
          b.classList.toggle("on", story.includes(b.dataset.v));
          b.classList.toggle("off", !story.includes(b.dataset.v) && !!placeSel.v && !MORALS[b.dataset.v][2].includes(placeSel.v));
        });
        el.querySelectorAll("[data-chips=place] .chip").forEach(b => {
          const v = b.dataset.v;
          b.classList.toggle("on", v === placeSel.v);
          b.classList.toggle("off", !!v && story.some(k => !ALLS[k][2].includes(v)));
        });
        el.querySelectorAll("[data-chips=cast] .chip").forEach(b => b.classList.toggle("on", cast.includes(b.dataset.v)));
        const parts = [story.length ? story.map(k => ALLS[k][1] + " " + ALLS[k][0]).join(" → ") : "🎲 surprise story",
          cast.length ? cast.map(k => CAST[k][1] + " " + CAST[k][0]).join(" & ") : "🎲 surprise stars",
          placeSel.v ? PLACES[placeSel.v][1] + " " + PLACES[placeSel.v][0] : "🎲 surprise place"];
        el.querySelector("#picked").innerHTML = `<b>Your short:</b> ${parts.map(esc).join(" · ")}`;
      };
      el.querySelectorAll("[data-chips=story] .chip").forEach(b => b.onclick = () => {
        const i = story.indexOf(b.dataset.v);
        if (story.some(k => MORALS[k])) story.length = 0;  // a lesson story is the whole short
        if (i >= 0) story.splice(i, 1); else if (story.length < 5) story.push(b.dataset.v); else toast("Up to 5 stories");
        paint();
      });
      el.querySelectorAll("[data-chips=moral] .chip").forEach(b => b.onclick = () => {
        const on = story.includes(b.dataset.v);
        story.length = 0;
        if (!on) story.push(b.dataset.v);
        paint();
      });
      el.querySelectorAll("[data-chips=cast] .chip").forEach(b => b.onclick = () => {
        const i = cast.indexOf(b.dataset.v);
        if (i >= 0) cast.splice(i, 1); else { if (cast.length >= 2) cast.shift(); cast.push(b.dataset.v); }
        paint();
      });
      el.querySelectorAll("[data-chips=place] .chip").forEach(b => b.onclick = () => { placeSel.v = b.dataset.v; paint(); });
      el.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { el.querySelector("#idea").value = b.dataset.ex; });
      el.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { n = +b.dataset.n; el.querySelectorAll("[data-n]").forEach(x => x.classList.toggle("on", x === b)); });
      paint();
      el.querySelector("#go").onclick = ev => guard(ev.currentTarget, async () => {
        const text = el.querySelector("#idea").value.trim();
        const choose = { gags: [...story], cast: [...cast], set: placeSel.v || undefined };
        const label = [story.length ? story.map(k => ALLS[k][0]).join(", ") : "", cast.length ? `with ${cast.map(k => CAST[k][0]).join(" & ")}` : "",
          placeSel.v ? `at the ${PLACES[placeSel.v][0].toLowerCase()}` : "", text].filter(Boolean).join(" ");
        const channel_id = el.querySelector("#ch")?.value || channels[0].id;
        await api.commands([...Array(n)].map(() => ({ type: "generate", payload: { channel_id, idea: label || undefined, choose, silent: true } })));
        close(); toast(`Making ${n} short${n > 1 ? "s" : ""} – they'll be ready to approve soon`);
        state.tab = "progress"; if (location.hash !== "#/shorts") location.hash = "#/shorts"; else refresh();
      });
    });
}

// ---------------------------------------------------------------- Views (YouTube stats)
function viewStats() {
  const vids = state.episodes.filter(e => e.youtube_url && ["published", "scheduled"].includes(e.status));
  const day = d => d.toISOString().slice(0, 10);
  const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (13 - i)); return day(d); });
  const at = (e, d) => { let v = null; for (const [k, n] of (e.yt?.hist || [])) if (k <= d) v = n; return v; };
  const daily = days.map((d, i) => i ? vids.reduce((s, e) => {
    const a = at(e, d), b = at(e, days[i - 1]), born = e.publish_at && day(new Date(e.publish_at)) === d;
    return s + (a != null && (b != null || born) ? Math.max(0, a - (b || 0)) : 0); }, 0) : 0);
  const total = vids.reduce((s, e) => s + (e.views || 0), 0), likes = vids.reduce((s, e) => s + (e.likes || 0), 0);
  const comments = vids.reduce((s, e) => s + (e.yt?.comments || 0), 0), today = daily[13];
  const priv = vids.filter(e => e.yt?.privacy === "private" && e.status === "published");
  const top = [...vids].sort((a, b) => (b.views || 0) - (a.views || 0));
  const best = Math.max(1, top[0]?.views || 0);
  const updated = vids.map(e => e.stats_at).filter(Boolean).sort().pop();
  const mx = Math.max(1, ...daily);
  const kpi = (icon, label, n, d) => `<div class="card"><div class="l">${ic(icon, 14)} ${label}</div><div class="n">${n}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`;
  root.innerHTML = shell("views", `
    <h1>Views</h1><div class="sub" style="margin-bottom:12px">${updated ? `Updated ${ago(updated)} ago · refreshes by itself every 2 hours.` : "Views appear here once your shorts are on YouTube."}
      <button class="btn" id="refreshStats" style="margin-left:6px;padding:5px 10px;font-size:12.5px">${ic("refresh", 14)} Update now</button></div>
    <div class="kpis">${kpi("eye", "Total views", fmtNum(total), today ? `+${fmtNum(today)} today` : "")}${kpi("heart", "Likes", fmtNum(likes))}${kpi("chat", "Comments", fmtNum(comments))}${kpi("yt", "Shorts on YouTube", vids.length)}</div>
    <div id="chanStats"></div>
    <div id="trends"></div>
    ${priv.length ? `<div class="card" style="margin-top:12px;border-color:var(--amber)"><b>${ic("lock", 15)} ${priv.length} of your shorts are still Private on YouTube</b>
      <div class="sub" style="margin-top:4px">Private shorts can't get views. YouTube keeps uploads from new apps private until Google approves the app (the “YouTube API audit” form). Until then: YouTube Studio → Content → select them → Edit → Visibility → Public.</div>
      <a class="btn" style="margin-top:10px" href="https://studio.youtube.com/" target="_blank" rel="noopener">${ic("ext", 15)} Open YouTube Studio</a></div>` : ""}
    <h2>Views per day · 14 days</h2>
    <div class="card"><div class="chart">${daily.map((n, i) => `<div class="${i === 13 ? "v" : ""}" style="height:${(n / mx) * 100}%" title="${n} views"></div>`).join("")}</div>
      <div class="chart-l">${days.map((d, i) => `<span>${i % 2 ? "" : new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</span>`).join("")}</div>
      ${daily.some(Boolean) ? "" : `<div class="hint" style="text-align:center">The daily chart fills in as the views come in.</div>`}</div>
    <h2>Your shorts by views</h2>
    <div class="grid">${top.length ? top.map((e, i) => `<div class="card rank">
      <div class="no">${i + 1}</div>
      <button class="th" data-video="${e.id}" data-thumb="${e.id}" aria-label="Play">${thumbInner(e)}</button>
      <div><h3>${esc(e.title || "Short")}</h3>
        <div class="nums"><span class="pill green">${ic("eye", 12)} ${fmtNum(e.views || 0)}</span><span class="pill">${ic("heart", 12)} ${fmtNum(e.likes || 0)}</span>
          <span class="pill">${ic("chat", 12)} ${fmtNum(e.yt?.comments || 0)}</span>
          ${e.status === "scheduled" ? `<span class="pill amber">${ic("clock", 12)} Scheduled</span>` : e.yt?.privacy === "private" ? `<span class="pill red">${ic("lock", 12)} Private</span>` : e.yt?.privacy === "unlisted" ? `<span class="pill amber">Unlisted</span>` : ""}
          ${e.publish_at ? `<span class="pill">${ago(e.publish_at)} ago</span>` : ""}
          <a class="pill" href="${esc(e.youtube_url)}" target="_blank" rel="noopener">${ic("ext", 12)} YouTube</a></div>
        <div class="bar"><i style="width:${Math.max(2, (e.views || 0) / best * 100)}%"></i></div></div></div>`).join("")
      : `<div class="card empty"><b>Nothing on YouTube yet</b>Publish a short and its views show up here.</div>`}</div>`, { fab: false });
  root.querySelector("#refreshStats").onclick = ev => guard(ev.currentTarget, async () => { await api.command("stats", {}); toast("Updating views – about a minute"); setTimeout(refresh, 70000); });
  bindCommon();
  fillThumbs(top.slice(0, 60));
  api.settings().then(st => {
    const cs = state.channels.map(c => [c, st["yt_" + c.id]]).filter(([, v]) => v);
    const el = document.getElementById("chanStats");
    if (el && cs.length) el.innerHTML = `<h2>Channels</h2><div class="grid">${cs.map(([c, v]) => `<div class="card" style="display:flex;gap:12px;align-items:center;padding:12px 14px">
      <div style="flex:1;min-width:0"><b>${esc(v.title || c.name)}</b><div class="sub">${fmtNum(v.videos)} videos</div></div>
      <span class="pill">${ic("users", 12)} ${v.hidden_subs ? "hidden" : fmtNum(v.subs)} subscribers</span><span class="pill green">${ic("eye", 12)} ${fmtNum(v.views)}</span></div>`).join("")}</div>`;
    const tw = document.getElementById("trends");
    if (tw) tw.innerHTML = trendsCard(st.trends);
  }).catch(() => {});
}

// what's working: learned from our own shorts (pipeline/trends.py) - new shorts lean towards the winners
function trendsCard(t) {
  if (!t) return "";
  if (!t.kinds || !Object.keys(t.kinds).length) return `<h2>What's working</h2><div class="card sub">${ic("chart", 14)} Learning from your shorts once ${8} or more have a day of views (${t.n || 0} so far). New shorts then lean towards what kids watch most.</div>`;
  const TITLES = { how: "“How To …”", dont: "“Don't …”", question: "Questions", name: "Name + action", exclaim: "Exclamations", the: "“The …”", challenge: "Challenges", other: "Other" };
  const name = (k, v) => k === "char" ? (CAST[v] ? CAST[v][1] + " " + CAST[v][0] : v) : k === "place" ? (PLACES[v] ? PLACES[v][1] + " " + PLACES[v][0] : v)
    : k === "story" ? (ALLS[v] ? ALLS[v][1] + " " + ALLS[v][0] : v) : k === "title" ? (TITLES[v] || v) : k === "type" ? (v === "lesson" ? "💛 Lesson stories" : "😂 Funny stories") : v;
  const rows = [["story", "Stories"], ["place", "Places"], ["char", "Characters"], ["title", "Title styles"], ["type", "Funny vs lesson"], ["length", "Length"]];
  const pct = e => { const p = Math.round((Math.exp(e) - 1) * 100); return (p > 0 ? "+" : "") + p + "%"; };
  const blocks = rows.map(([k, label]) => {
    const vals = Object.entries(t.kinds[k] || {}).filter(([, v]) => v.n >= 2).sort((a, b) => b[1].effect - a[1].effect);
    if (vals.length < 2) return "";
    const pick = vals.length > 4 ? [...vals.slice(0, 3), vals[vals.length - 1]] : vals;
    return `<div class="card" style="padding:12px 14px"><b>${label}</b>${pick.map(([v, x], i) => `<div style="display:flex;gap:8px;align-items:center;margin-top:7px">
      <span style="flex:1;min-width:0">${esc(name(k, v))}${vals.length > 4 && i === 3 ? ` <span class="sub">(weakest)</span>` : ""}</span>
      <span class="sub">${x.n} shorts</span><span class="pill ${x.effect > 0.05 ? "green" : x.effect < -0.05 ? "red" : ""}">${pct(x.effect)}</span></div>`).join("")}</div>`;
  }).join("");
  return `<h2>What's working</h2><div class="sub" style="margin:-4px 0 8px">Views on day 1 compared with similar shorts, after taking out the effect of publish time. Based on ${t.n} shorts, updated ${ago(t.at) === "now" ? "just now" : ago(t.at) + " ago"}. New shorts use the winners more often, and everything still gets a turn.</div><div class="grid">${blocks}</div>`;
}

// ---------------------------------------------------------------- Channels
function viewChannels() {
  const channels = state.channels;
  const total = channels.filter(c => c.auto_daily).reduce((s, c) => s + (+c.per_day || 0), 0);
  root.innerHTML = shell("channels", `
    <h1>Channels</h1><div class="sub" style="margin-bottom:12px">Every morning: <b>${total}</b> new short${total === 1 ? "" : "s"} across your channels.${total > 20 ? ' <span class="pill amber">more than ~20/day takes longer to render</span>' : ""}</div>
    <div class="grid">${channels.map(c => `<div class="card">
      <div class="chan"><div class="av">${esc((c.name || "?")[0].toUpperCase())}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:17px">${esc(c.name)}</div><div class="sub">${c.connected ? `${ic("yt", 14)} ${esc(c.youtube_title || "Connected")}` : "Not connected to YouTube yet"}</div></div>
        ${c.connected ? `<span class="pill green">${ic("check", 12)} Connected</span>` : '<span class="pill red">Not connected</span>'}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0">
        <span class="pill">${c.auto_daily ? `${c.per_day} new / day` : "Only when you ask"}</span>${c.made_for_kids ? '<span class="pill">Made for kids</span>' : ""}</div>
      <div class="actions">${c.connected ? "" : `<button class="btn primary" data-connect="${c.id}">${ic("link", 16)} Connect YouTube</button>`}
        <button class="btn" data-edit="${c.id}">${ic("edit", 16)} Edit</button>
        ${c.connected ? `<button class="btn ghost" data-connect="${c.id}">${ic("refresh", 16)} Reconnect</button>` : ""}</div></div>`).join("") || '<div class="card empty"><b>No channels yet</b>Add your YouTube channel to start.</div>'}</div>
    <div style="margin-top:12px"><button class="btn block" id="add">${ic("plus", 16)} Add a channel</button></div>
    <div class="hint" style="margin-top:10px">Tip: 2–3 channels with a few shorts each per day look less “mass-produced” to YouTube than 20 on one.</div>`, { fab: false });
  root.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => channelSheet(channels.find(c => c.id === b.dataset.edit)));
  root.querySelectorAll("[data-connect]").forEach(b => b.onclick = () => connectYouTube(b.dataset.connect));
  root.querySelector("#add").onclick = () => channelSheet(null);
  bindCommon();
}

function channelSheet(c) {
  c = c || { name: "", niche: "", per_day: 5, auto_daily: true, made_for_kids: true };
  sheet(`<h3>${c.id ? "Edit channel" : "New channel"}</h3>
    <label class="f">Name (for you)</label><input class="input" id="nm" value="${esc(c.name)}" placeholder="e.g. Pip & Friends">
    <label class="f">About this channel <span class="sub" style="font-weight:500">(optional)</span></label><input class="input" id="ni" value="${esc(c.niche || "")}" placeholder="e.g. funny 3D cartoon shorts for kids 2-6">
    <div class="row"><div><div class="t">New shorts every morning</div><div class="d">${["false", "0", "no", "off", false].includes(state.settings?.auto_publish ?? true) ? "They wait for your OK" : "Published automatically at the best times"}</div></div><label class="switch"><input type="checkbox" id="ad" ${c.auto_daily ? "checked" : ""}><span></span></label></div>
    <label class="f" style="margin-top:4px">Shorts per day</label><div class="seg" id="pd">${[1, 3, 5, 10, 20].map(n => `<button type="button" data-n="${n}" class="${+c.per_day === n ? "on" : ""}">${n}</button>`).join("")}</div>
    <div class="row"><div><div class="t">Made for kids</div><div class="d">Required by law when the audience is children</div></div><label class="switch"><input type="checkbox" id="mk" ${c.made_for_kids ? "checked" : ""}><span></span></label></div>
    <div style="margin-top:16px;display:flex;gap:8px">${c.id ? `<button class="btn ghost danger" id="del" aria-label="Delete channel">${ic("trash", 16)}</button>` : ""}<button class="btn primary block" id="go">Save</button></div>`,
    (el, close) => {
      let per = +c.per_day || 5;
      el.querySelectorAll("#pd [data-n]").forEach(b => b.onclick = () => { per = +b.dataset.n; el.querySelectorAll("#pd [data-n]").forEach(x => x.classList.toggle("on", x === b)); });
      el.querySelector("#go").onclick = ev => guard(ev.currentTarget, async () => {
        const v = { name: el.querySelector("#nm").value.trim(), niche: el.querySelector("#ni").value.trim() || "funny 3D cartoon shorts for kids",
          auto_daily: el.querySelector("#ad").checked, per_day: per, made_for_kids: el.querySelector("#mk").checked };
        if (!v.name) throw new Error("Give it a name");
        await api.saveChannel(c.id, v); close(); toast("Saved"); state.channels = await api.channels(); viewChannels();
      });
      el.querySelector("#del")?.addEventListener("click", ev => { if (confirm(`Delete channel “${c.name}”? Its videos stay on YouTube.`)) guard(ev.currentTarget, async () => { await api.deleteChannel(c.id); close(); state.channels = await api.channels(); viewChannels(); }); });
    });
}

function redirectUri() { return location.origin + location.pathname; }
function connectYouTube(channelId) {
  if (DEMO) { api.command("connect_channel", { channel_id: channelId }); toast("Demo: connected"); return viewChannels(); }
  if (!CFG.GOOGLE_CLIENT_ID || CFG.GOOGLE_CLIENT_ID.includes("YOUR_")) return toast("Add GOOGLE_CLIENT_ID to config.js first");
  const p = new URLSearchParams({ client_id: CFG.GOOGLE_CLIENT_ID, redirect_uri: redirectUri(), response_type: "code", access_type: "offline", prompt: "consent select_account",
    scope: "https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube.readonly", state: channelId });
  if (window.missionDesktop) toast("Finishing in your web browser – sign in there if asked");
  location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + p;
}
function stashConnect() {
  const u = new URL(location.href), code = u.searchParams.get("code"), ch = u.searchParams.get("state"), err = u.searchParams.get("error");
  if (!code && !err) return;
  history.replaceState(null, "", redirectUri() + "#/channels");
  if (err) return toast("YouTube connection cancelled");
  try { sessionStorage.setItem("mc_connect", JSON.stringify({ code, ch, at: Date.now() })); } catch {}
}
async function finishConnect() {
  let p = null;
  try { p = JSON.parse(sessionStorage.getItem("mc_connect") || "null"); sessionStorage.removeItem("mc_connect"); } catch {}
  if (!p || Date.now() - p.at > 9 * 6e4) return;
  await api.command("connect_channel", { channel_id: p.ch, code: p.code, redirect_uri: redirectUri() });
  toast("Connecting your channel… it turns green in about a minute");
}

// ---------------------------------------------------------------- Settings

  const s = state.settings = await api.settings().catch(() => state.settings || {});
  const gpu = ["true", "1", "yes", true].includes(s.gpu_render);
  const auto = !["false", "0", "no", "off", false].includes(s.auto_publish ?? true);
  const ios = /iphone|ipad/i.test(navigator.userAgent);
  root.innerHTML = shell("settings", `
    <h1>Settings</h1>
    <h2>Making shorts</h2>
    <div class="card">
      <div class="row"><div><div class="t">Render on the free GPU first</div><div class="d">Full 1080p, sharper light, faster when Kaggle has a free graphics card. Falls back to the normal machines automatically.</div></div>
        <label class="switch"><input type="checkbox" id="gpu" ${gpu ? "checked" : ""}><span></span></label></div>
      <div class="row"><div><div class="t">Publish automatically</div><div class="d">Every finished short is scheduled on YouTube at the next best time (US + UK/Ireland peak hours, 30+ min apart). Delete one in “Ready” before it's booked to stop it.</div></div>
        <label class="switch"><input type="checkbox" id="autopub" ${auto ? "checked" : ""}><span></span></label></div>
      <div class="row"><div><div class="t">Stories with a lesson 💛</div><div class="d">Half of the daily shorts are moral stories: good things take time, sharing, helping a friend, saying sorry, teamwork, never giving up</div></div></div>
      <div class="row"><div><div class="t">Every short</div><div class="d">3D cartoon · 20–40 s · music + sound effects only · no text on screen · ${auto ? "published automatically at the best times" : "nothing posts without your OK"}</div></div></div>
    </div>
    <h2>App</h2>
    <div class="card">
      <div class="row"><div><div class="t">Install Shorts Studio</div><div class="d">${standalone() ? "Installed ✓" : ios ? "On iPhone: Share → Add to Home Screen" : "On computer or Android: Install button, or browser menu → Install app"}</div></div>
        ${installEvt && !standalone() ? `<button class="btn primary" id="install2">${ic("dl", 16)} Install</button>` : ""}</div>
      <div class="row"><div><div class="t">Notifications</div><div class="d">${canNotify() ? "On – you'll hear when shorts are ready" : "Get told when shorts are ready to approve"}</div></div>
        ${canNotify() ? "" : `<button class="btn" id="notif">Turn on</button>`}</div>
      ${window.missionDesktop ? "" : `<div class="row"><div><div class="t">Windows app</div><div class="d">Tray icon, starts with Windows, desktop notifications</div></div>
        ${CFG.GITHUB_REPO && !CFG.GITHUB_REPO.includes("YOUR_") ? `<a class="btn" href="https://github.com/${esc(CFG.GITHUB_REPO)}/releases/latest" target="_blank" rel="noopener">${ic("dl", 16)} Download</a>` : ""}</div>`}
    </div>
    <h2>Free services</h2>
    <div class="card"><div class="row"><div><div class="t">All €0</div><div class="d">Blender 3D on GitHub Actions · Kaggle free GPU · Gemini for ideas &amp; titles · Supabase · Vercel · YouTube API</div></div></div></div>
    <h2>Account</h2>
    <div class="card"><div class="row"><div><div class="t">${esc(state.user?.email || "")}</div><div class="d">Only this login can open the app</div></div><button class="btn" id="logout">Sign out</button></div>
      ${CFG.GITHUB_REPO && !CFG.GITHUB_REPO.includes("YOUR_") ? `<div class="row"><div><div class="t">Worker logs</div><div class="d">See exactly what ran in the cloud</div></div><a class="btn" target="_blank" rel="noopener" href="https://github.com/${esc(CFG.GITHUB_REPO)}/actions">${ic("ext", 16)} Open</a></div>` : ""}</div>`, { fab: false });
  root.querySelector("#gpu").onchange = e => guard(null, async () => { await api.setSetting("gpu_render", e.target.checked); toast(e.target.checked ? "GPU rendering on" : "GPU rendering off"); });
  root.querySelector("#autopub").onchange = e => guard(null, async () => { await api.setSetting("auto_publish", e.target.checked); toast(e.target.checked ? "Auto-publish on — shorts go out at the best times" : "Auto-publish off — shorts wait for your OK"); viewSettings(); });
  root.querySelector("#notif")?.addEventListener("click", async () => { if (!("Notification" in window)) return toast("This browser doesn't support notifications"); const r = await Notification.requestPermission(); toast(r === "granted" ? "Notifications on" : "Notifications blocked – allow them in browser settings"); viewSettings(); });
  root.querySelector("#logout").onclick = () => api.logout();
  root.querySelector("#install2")?.addEventListener("click", () => document.getElementById("install")?.click());
  bindCommon();
}

function viewLogin(msg) {
  root.innerHTML = `<div class="login"><div style="text-align:center;margin-bottom:22px"><img src="icon.svg" style="width:60px;border-radius:16px"><h1>Shorts Studio</h1><div class="sub">Your 3D YouTube Shorts, made for you every day</div></div>
    <form class="card" id="lf">${msg ? `<div class="err">${esc(msg)}</div>` : ""}
      <label class="f" style="margin-top:0">Email</label><input class="input" type="email" id="em" autocomplete="username" required>
      <label class="f">Password</label><input class="input" type="password" id="pw" autocomplete="current-password" required>
      <div style="margin-top:18px"><button class="btn primary block">Sign in</button></div></form></div>`;
  root.querySelector("#lf").onsubmit = ev => { ev.preventDefault(); guard(ev.submitter, async () => { try { await api.login(root.querySelector("#em").value, root.querySelector("#pw").value); boot(); } catch { viewLogin("Wrong email or password."); } }); };
}

// ---------------------------------------------------------------- router: draw instantly from what we have, then refresh
const VIEWS = { "": viewHome, shorts: viewShorts, views: viewStats, channels: viewChannels, settings: viewSettings };
function page() { return location.hash.replace(/^#\/?/, "").split("/")[0]; }
let lastSig = "";
function route(local = false) {
  if (!local) document.querySelectorAll(".sheet-bg").forEach(x => x.remove());
  const go = VIEWS[page()] || viewHome;
  const y = scrollY;
  try { const r = go(); if (r?.catch) r.catch(fail); } catch (e) { fail(e); }
  if (local) scrollTo(0, y);
  updateBadge();
}
function fail(e) { console.error(e); root.innerHTML = shell("home", `<div class="card empty"><b>Couldn't load</b>${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">Try again</button></div>`); }
async function load() {
  const [eps, ch] = await Promise.all([api.episodes(), api.channels()]);
  state.episodes = eps; state.channels = ch;
  const sig = JSON.stringify([eps.map(e => [e.id, e.status, e.title, e.thumb_path, e.views, e.likes, e.stats_at, e.error]), ch.map(c => [c.id, c.connected, c.per_day, c.name, c.auto_daily])]);
  if (sig !== lastSig) { lastSig = sig; if (!document.querySelector(".sheet-bg") && page() !== "settings") route(true); }
}
let rt;
function refresh() { clearTimeout(rt); rt = setTimeout(() => load().catch(e => console.warn(e)), 350); }

// ---------------------------------------------------------------- notifications
const notified = new Set(); let pendingReady = [], notifyTimer;
function canNotify() { return "Notification" in window && Notification.permission === "granted"; }
function onEpisodeChange(payload) {
  const e = payload.new || {};
  if (payload.eventType !== "UPDATE" || e.status !== "awaiting_approval" || notified.has(e.id)) return;
  notified.add(e.id); pendingReady.push(e.title || "New short");
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(() => {
    const list = pendingReady; pendingReady = [];
    if (!canNotify() || (document.hasFocus() && location.hash.startsWith("#/shorts"))) return;
    const n = new Notification(list.length > 1 ? `${list.length} shorts ready to approve` : "Short ready to approve",
      { body: list.slice(0, 3).join(" · "), icon: "icon-192.png", tag: "ss-ready" });
    n.onclick = () => { window.missionDesktop ? window.missionDesktop.focus("#/shorts") : window.focus(); location.hash = "#/shorts"; n.close(); };
  }, 4000);
}
function updateBadge() { if (window.missionDesktop) window.missionDesktop.setBadge(readyCount()); }

async function boot() {
  stashConnect();
  state.user = await api.user();
  if (!state.user) return viewLogin();
  window.onhashchange = () => route();
  if (state.episodes.length || state.channels.length) route();   // last known data shows instantly
  finishConnect().catch(e => toast("⚠️ " + e.message));
  await load().catch(e => { if (!state.episodes.length) fail(e); });
  if (!lastSig) route();
  if (!DEMO) {
    if (window.missionDesktop && "Notification" in window && Notification.permission === "default") Notification.requestPermission();
    sb.channel("live").on("postgres_changes", { event: "*", schema: "public", table: "episodes" }, p => { onEpisodeChange(p); refresh(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "channels" }, refresh)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "activity" }, () => { if (page() === "") { const f = document.getElementById("feed"); if (f) viewHome(); } })
      .subscribe();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    setInterval(() => { if (!document.hidden && state.episodes.some(e => ["queued", "generating", "publishing"].includes(e.status))) refresh(); }, 30000);
  }
}
boot();
</script>
