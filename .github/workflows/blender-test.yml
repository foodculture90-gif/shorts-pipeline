name: Blender test render

on:
  push:
    paths: ["blender/**", ".github/workflows/blender-test.yml"]
  workflow_dispatch:

jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gag: steal_treat, set: street, hero: pip, friend: chiko, prop: cake}
          - {gag: ball_bonk, set: park, hero: bubu, friend: pip, prop: ball}
          - {gag: balloon_float, set: beach, hero: mimi, friend: gogo, prop: balloon}
          - {gag: gift_surprise, set: kitchen, hero: gogo, friend: bubu, prop: gift}
          - {gag: hide_seek, set: park, hero: chiko, friend: mimi, prop: bush}
          - {gag: slip_peel, set: street, hero: pip, friend: bubu, prop: peel}
    steps:
      - uses: actions/checkout@v4
      - name: Get Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 ffmpeg > /dev/null
          for v in 4.2.3 4.2.2 4.2.1 4.2.0; do
            if curl -fsSL "https://download.blender.org/release/Blender4.2/blender-$v-linux-x64.tar.xz" -o b.tar.xz; then
              tar -xJf b.tar.xz && mv "blender-$v-linux-x64" bl && break
            fi
          done
      - name: Render preview frames
        env: {SAMPLES: "10", RES: "30"}
        run: |
          echo '{"gag":"${{ matrix.gag }}","set":"${{ matrix.set }}","hero":"${{ matrix.hero }}","friend":"${{ matrix.friend }}","prop":"${{ matrix.prop }}","seed":7}' > spec.json
          ./bl/blender -b --python blender/scene.py -- spec.json out every:12 2>&1 | grep -E "^frame|done|Error|Traceback|rror|line [0-9]+" | head -60
          ls out/frames | wc -l
          ffmpeg -y -loglevel error -pattern_type glob -i 'out/frames/*.png' -filter_complex "scale=324:576,tile=7x2:padding=4" -frames:v 1 -q:v 3 "sheet_${{ matrix.gag }}.jpg"
      - name: Upload sheet
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          for f in sheet_*.jpg; do
            [ -f "$f" ] || continue
            curl -sS -X POST "$SUPABASE_URL/storage/v1/object/media/tests/$f" \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "x-upsert: true" -H "Content-Type: image/jpeg" \
              --data-binary @"$f"; echo
          done
