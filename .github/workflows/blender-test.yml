name: Blender test render

on:
  push:
    paths: ["blender/**", ".github/workflows/blender-test.yml", "pipeline/get_assets.sh"]
  workflow_dispatch:

jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gag: patience, set: park, hero: kiki, friend: ellie, prop: seed, sky: day, season: summer, acc: bow, acc2: none, every: 44}
          - {gag: sharing, set: kitchen, hero: pip, friend: nino, prop: cookie, sky: day, season: summer, acc: none, acc2: cap, every: 38}
          - {gag: helping, set: street, hero: rexy, friend: bubu, prop: boxes, sky: morning, season: summer, acc: cap, acc2: bow, every: 40}
          - {gag: sorry, set: livingroom, hero: bolt, friend: lulu, prop: blocks, sky: day, season: summer, acc: none, acc2: flower, every: 40}
          - {gag: teamwork, set: farm, hero: ocki, friend: teo, prop: rock, sky: golden, season: autumn, acc: crown, acc2: none, every: 38}
          - {gag: try_again, set: castle, hero: hoot, friend: zuzu, prop: star, sky: day, season: spring, acc: none, acc2: crown, every: 38}
          - {gag: seesaw, set: playground, hero: bolt, friend: ellie, prop: seesaw, sky: morning, season: summer, acc: none, acc2: flower, every: 12}
          - {gag: paint_splat, set: livingroom, hero: nino, friend: momo, prop: paint, sky: day, season: summer, acc: cap, acc2: crown, every: 12}
    steps:
      - uses: actions/checkout@v4
      - name: Get Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 ffmpeg > /dev/null
          for v in 4.2.3 4.2.2 4.2.1 4.2.0; do
            if curl -fsSL "https://download.blender.org/release/Blender4.2/blender-$v-linux-x64.tar.xz" -o b.tar.xz; then
              tar -xJf b.tar.xz && mv "blender-$v-linux-x64" bl && break
            fi
          done
      - uses: actions/cache@v4
        with:
          path: assets
          key: free-assets-v3
      - name: Free sky photos + toy models
        run: bash pipeline/get_assets.sh assets
      - name: Render preview frames
        env: {SAMPLES: "12", RES: "30", ASSETS: "${{ github.workspace }}/assets"}
        run: |
          echo '{"gag":"${{ matrix.gag }}","set":"${{ matrix.set }}","hero":"${{ matrix.hero }}","friend":"${{ matrix.friend }}","prop":"${{ matrix.prop }}","seed":7,"color":"blue","theme":{"sky":"${{ matrix.sky }}","season":"${{ matrix.season }}","pal":1${{ strategy.job-index }}7},"looks":{"${{ matrix.hero }}":["${{ matrix.acc }}","#FF4D6D"],"${{ matrix.friend }}":["${{ matrix.acc2 }}","#FFD23F"]}}' > spec.json
          timeout 25m ./bl/blender -b --python blender/scene.py -- spec.json out every:${{ matrix.every }} 2>&1 | grep -E "^frame|done|Error|Traceback|rror|line [0-9]+|kenney|dressing|pets|devices" | head -80
          ls out/frames | wc -l
          sudo apt-get install -y -qq fluidsynth fluid-soundfont-gm > /dev/null && pip install -q numpy
          python3 blender/audio.py out/events.json sound.wav 7 7 && ffmpeg -y -loglevel error -i sound.wav -b:a 128k "sound_${{ matrix.gag }}_${{ matrix.hero }}.mp3" || true
          python3 - <<'PY' || true
          import sys; sys.path.insert(0, "blender"); import audio as A, numpy as np, json
          ev = json.load(open("out/events.json"))
          m = A.music(7, 7) * 0.42
          fx = A.mix(ev["events"], 24, 7, 7, music_gain=0.0, sets=ev.get("sets"))
          rms = lambda x: float(np.sqrt(np.mean(x ** 2)) + 1e-9)
          print("LEVELS music_rms", round(rms(m), 4), "fx_rms", round(rms(fx), 4), "ratio_db", round(20 * np.log10(rms(m) / rms(fx)), 1))
          PY
          ffmpeg -y -loglevel error -pattern_type glob -i 'out/frames/*.png' -filter_complex "scale=324:576,tile=7x2:padding=4" -frames:v 1 -q:v 3 "sheet_${{ matrix.gag }}_${{ matrix.hero }}.jpg"
      - name: Upload sheet
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          for f in sheet_*.jpg sound_*.mp3; do
            [ -f "$f" ] || continue
            case "$f" in *.mp3) ct=audio/mpeg;; *) ct=image/jpeg;; esac
            curl -sS -X POST "$SUPABASE_URL/storage/v1/object/media/tests/$f" \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "x-upsert: true" -H "Content-Type: $ct" \
              --data-binary @"$f"; echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheet-${{ strategy.job-index }}
          path: sheet_*.jpg
          retention-days: 2

  collect:   # all sheets on the "test-sheets" branch, so they can be looked at without logging in anywhere
    needs: sheets
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: s
          merge-multiple: true
      - name: Push sheets to the test-sheets branch
        run: |
          mkdir pub && cd pub && git init -q && git checkout -q -b test-sheets
          cp ../s/*.jpg . 2>/dev/null || true
          ls
          git config user.name "sheets-bot" && git config user.email "sheets-bot@users.noreply.github.com"
          git add -A && git commit -qm "test sheets ${{ github.sha }}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-sheets

