name: Worker

on:
  repository_dispatch:
    types: [command]          # fired instantly by the app
  schedule:
    - cron: "7 6 * * *"       # daily shorts queued ~07:07 Irish time (06:07 UTC)
    - cron: "37 */2 * * *"    # safety net + resumes work waiting for tomorrow's free quota
  workflow_dispatch:
    inputs:
      mode: {description: "queue, or test3d = make 1 test short rendered on the free GPU", default: "queue"}
      idea: {description: "test3d only: an idea for the test short", default: ""}

concurrency:
  group: worker
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # show progress in the log live
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      queued: ${{ steps.check.outputs.queued }}
    steps:
      - uses: actions/checkout@v4
        if: github.event.schedule == '7 6 * * *'
      - uses: actions/setup-python@v5
        if: github.event.schedule == '7 6 * * *'
        with:
          python-version: "3.12"
          cache: pip
      - name: Queue today's shorts
        if: github.event.schedule == '7 6 * * *'
        run: pip install -q -r requirements.txt && python -m pipeline.worker daily
      - name: Anything to do?
        id: check
        run: |
          n=$(curl -s "$SUPABASE_URL/rest/v1/commands?status=eq.queued&run_after=lte.$(date -u +%Y-%m-%dT%H:%M:%SZ)&select=id" \
                -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)")
          r=$(curl -s "$SUPABASE_URL/rest/v1/episodes?status=eq.failed&error=like.*3D*&story->>retries=is.null&select=id" \
                -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)")
          n=$((n + r))   # 3D shorts whose render failed once get one more try
          s=$(curl -s "$SUPABASE_URL/rest/v1/settings?key=eq.stats_at&select=value" \
                -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              | python3 -c "import sys,json,datetime as d; r=json.load(sys.stdin); v=r[0]['value'] if isinstance(r,list) and r else None; print(0 if v and d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(str(v).replace('Z','+00:00'))<d.timedelta(hours=2) else 1)" 2>/dev/null || echo 0)
          n=$((n + s))   # refresh the YouTube views every ~2 hours
          [ "${{ github.event.inputs.mode }}" = "test3d" ] && n=1
          echo "queued now: $n"
          echo "queued=$n" >> "$GITHUB_OUTPUT"

  work:
    needs: plan
    if: needs.plan.outputs.queued != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4]     # 4 shorts are made at the same time
    permissions:
      contents: read
      actions: write          # lets the worker start the 3D render machines
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PANEL_URL: ${{ vars.PANEL_URL }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_USERNAME: storytimeeditor
      WORKER_ID: ${{ matrix.worker }}
      TEST_IDEA: ${{ github.event.inputs.idea }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Depth model cache
        uses: actions/cache@v4
        with:
          path: .models
          key: models-v2
      - run: bash pipeline/setup_tools.sh ffmpeg fonts
      - run: pip install -r requirements.txt
      - name: Work through the queue
        run: |
          mode=queue
          [ "${{ matrix.worker }}" = "1" ] && [ "${{ github.event.inputs.mode }}" = "test3d" ] && mode=test3d
          sleep $(( (${{ matrix.worker }} - 1) * 7 )) && python -m pipeline.worker $mode
